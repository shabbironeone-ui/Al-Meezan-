# Pings Supabase twice a week so the Free project never auto-pauses.
# Setup: GitHub repo > Settings > Secrets and variables > Actions > add SUPABASE_URL and SUPABASE_KEY.
name: Supabase keep-alive
on:
  schedule: [{ cron: "0 5 * * 1,4" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/app_settings?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
