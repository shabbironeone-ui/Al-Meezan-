name: Supabase keep-alive
on:
  schedule:
    - cron: "0 5 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://ofplfqawiupcmqvzkhfp.supabase.co
          KEY: sb_publishable_8VV3n9Dr_XXgDnkuonMTqg_Hkfm59z_
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/app_settings?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
