name: Supabase keep-alive
on:
  schedule:
    - cron: "0 5 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Missing secrets: add SUPABASE_URL and SUPABASE_KEY in Settings > Secrets and variables > Actions"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/app_settings?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase answered HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
