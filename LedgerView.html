<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Ledger</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .sbox{position:relative}.sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.18);margin-top:4px;overflow:hidden}
  .sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;font:inherit;cursor:pointer}
  .sug button:hover,.sug button:focus{background:var(--brand-soft)}.sug small{color:var(--muted)}
  .prof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.prof .grow{flex:1;min-width:200px}.prof h2{margin:0}.prof p{margin:2px 0 0;color:var(--muted);font-size:14px}
  .balbox{border-radius:var(--radius);padding:14px 16px;color:#fff;background:#047857;margin:12px 0}.balbox.due{background:var(--warn)}.balbox small{opacity:.85}.balbox b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
  .stats.six{grid-template-columns:1fr 1fr}@media(min-width:760px){.stats.six{grid-template-columns:repeat(3,1fr)}}@media(min-width:1000px){.stats.six{grid-template-columns:repeat(6,1fr)}}
  .stat.bad b{color:var(--danger)}
  .tabs{display:inline-flex;background:#e8edf3;border-radius:12px;padding:4px;margin:6px 0 12px}
  .tabs button{min-height:40px;padding:6px 18px;border:0;border-radius:9px;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--brand-dark);box-shadow:var(--shadow)}
  td.deb{color:var(--warn);font-weight:600}td.cre{color:#047857;font-weight:600}tr.sale td{background:#fff7ed}
  #pr{display:none}
  @media print{body{background:#fff}.page>*:not(#view):not(#pr){display:none!important}#view .no-print,.tabs{display:none!important}#pr{display:block;margin-bottom:8px}.card{box-shadow:none;border:0;padding:0}.balbox{color:#000;background:#fff;border:1px solid #000}.table-wrap{border:0;overflow:visible}table{min-width:0;font-size:11px}#planTab{display:block!important}}
</style>
</head>
<body>
<main class="page">
  <header class="appbar"><div><h1>Customer Ledger</h1><p>Statement, balance and installment plan</p></div></header>
  <section class="card no-print"><label for="q">Find a customer</label>
    <div class="sbox"><input id="q" type="search" placeholder="Type name, CAF number or mobile" autocomplete="off"><div class="sug" id="sug" hidden></div></div></section>
  <div id="hint" class="empty">Search for a customer to see the ledger.</div>

  <section id="view" hidden>
    <div id="pr"><h2 id="prShop"></h2><div>Customer statement · printed <span id="prDate"></span></div></div>
    <div class="card"><div class="prof"><div class="grow"><h2 id="pName"></h2><p id="pSub"></p><p id="pSub2"></p></div>
      <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="bWa">WhatsApp</button><button class="btn ghost" id="bPrint">Print</button><a class="btn" id="bRec" style="text-decoration:none;display:inline-grid;place-items:center" href="receipts.html">＋ Receipt</a></div></div></div>
    <div class="balbox" id="bal"></div>
    <section class="stats six" id="stats"></section>
    <div class="tabs"><button id="tL" aria-selected="true">Ledger</button><button id="tP" aria-selected="false">Installment plan</button></div>
    <div id="ledTab" class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Ref</th><th>Particulars</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody id="lBody"></tbody></table></div>
    <div id="planTab" hidden><div class="table-wrap"><table style="min-width:420px"><thead><tr><th>#</th><th>Month</th><th class="num">Due</th><th class="num">Paid</th><th class="num">Pending</th><th>Status</th></tr></thead><tbody id="pBody"></tbody></table></div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script>
<script>
const $ = id => document.getElementById(id), E = ERP.ui.esc, M = ERP.ui.money, N = v => Number(v) || 0, digits = s => String(s || "").replace(/\D/g, "");
const ST = { PAID: ["ok", "✓ Paid"], PARTIAL: ["warn", "Partial"], OVERDUE: ["bad", "Overdue"], DUE: ["warn", "Due this month"], UPCOMING: ["", "Upcoming"] };
const SO = "S/O D/O W/O"; let LIST = [], cur = null;
const mon = d => d ? new Date(d + "T12:00").toLocaleString("en", { month: "short", year: "numeric" }) : "";
const stat = (l, v, c) => `<div class="stat ${c || ""}"><small>${l}</small><b>${v}</b></div>`;

/* ---------- find a customer ---------- */
$("q").oninput = ERP.ui.debounce(() => {
  const q = $("q").value.trim().toLowerCase(), qd = digits(q); if (q.length < 2) { $("sug").hidden = true; return; }
  const r = LIST.filter(c => String(c.account_title || "").toLowerCase().includes(q) || String(c.account_no).includes(q) || (qd.length > 3 && digits(c.mobile_number).includes(qd))).slice(0, 8);
  $("sug").innerHTML = r.map(c => `<button data-a="${E(c.account_no)}"><span><b>${E(c.account_title)}</b><br><small>CAF ${E(c.account_no)} · ${E(c.mobile_number)}</small></span><small>${N(c.balance) > 0 ? "Rs " + M(c.balance) : "Clear"}</small></button>`).join("") || '<div class="empty" style="padding:14px">No customer found</div>';
  $("sug").hidden = false; }, 150);
$("q").onkeydown = e => { if (e.key === "Enter") { const b = $("sug").querySelector("button"); if (b) b.click(); else if ($("q").value.trim()) pick($("q").value.trim()); } };
$("sug").onclick = e => { const b = e.target.closest("button"); if (b) pick(b.dataset.a); };
document.addEventListener("click", e => { if (!e.target.closest(".sbox")) $("sug").hidden = true; });

async function pick(acc) {
  $("sug").hidden = true; $("hint").hidden = true; $("view").hidden = false; $("lBody").innerHTML = '<tr><td colspan="7"><div class="skeleton" style="width:60%"></div></td></tr>';
  try {
    const [c, b, led, sch] = await Promise.all([ERP.db.customers.get(acc), ERP.db.balanceOf(acc), ERP.db.ledger(acc), ERP.db.schedule(acc)]);
    if (!c) { $("view").hidden = true; $("hint").hidden = false; $("hint").textContent = "No customer found with CAF " + acc; return; }
    cur = { c, b: b || {}, led, sch }; $("q").value = c.account_title + " (" + c.account_no + ")"; history.replaceState(null, "", "?accNo=" + encodeURIComponent(c.account_no)); draw();
  } catch (e) { $("hint").hidden = false; $("view").hidden = true; $("hint").innerHTML = "Could not load: " + E(e.message) + "<br><small>If it mentions v_ledger_lines, run sql/09_ledger.sql.</small>"; }
}

function draw() {
  const { c, b, led, sch } = cur, now = new Date(), cm = new Date(now.getFullYear(), now.getMonth(), 1, 12).toISOString().slice(0, 10);
  $("pName").textContent = c.account_title; $("pSub").textContent = `CAF ${c.account_no}${c[SO] ? " · " + c[SO] : ""} · ${c.mobile_number || "no mobile"}`; $("pSub2").textContent = `CRO: ${c.cro || "-"} · Approved by: ${c.approved_by || "-"}${c.address ? " · " + c.address : ""}`;
  let run = 0, tD = 0, tC = 0; const rows = led.map(r => { run += N(r.debit) - N(r.credit); tD += N(r.debit); tC += N(r.credit); return { ...r, run }; });
  const bl = run; $("bal").className = "balbox" + (bl > 0.5 ? " due" : ""); $("bal").innerHTML = `<small>${bl < -0.5 ? "Paid in excess" : "Outstanding balance"}</small><b>${bl > 0.5 ? "Rs " + M(bl) : bl < -0.5 ? "Rs " + M(-bl) + " extra" : "Clear"}</b>`;
  const over = sch.filter(x => x.due_month < cm).reduce((s, x) => s + N(x.balance_due), 0), month = sch.filter(x => x.due_month === cm).reduce((s, x) => s + N(x.balance_due), 0), next = sch.find(x => N(x.balance_due) > 0 && x.due_month >= cm);
  $("stats").innerHTML = stat("Total sale", "Rs " + M(tD)) + stat("Total received", "Rs " + M(tC)) + stat("Installment / month", "Rs " + M(b.installment)) + stat("Overdue", "Rs " + M(over), over > 0 ? "bad" : "") + stat("Due this month", "Rs " + M(month)) + stat("Next due", next ? mon(next.due_month) : "-");
  $("lBody").innerHTML = rows.map(r => `<tr class="${r.kind === "Sale" ? "sale" : ""}"><td>${E(r.date)}</td><td>${E(r.kind)}</td><td>${E(r.ref)}</td><td style="white-space:normal;min-width:180px">${E(r.particulars)}</td><td class="num deb">${N(r.debit) ? M(r.debit) : ""}</td><td class="num cre">${N(r.credit) ? M(r.credit) : ""}</td><td class="num"><b>${M(r.run)}</b></td></tr>`).join("")
    + (rows.length ? `<tr style="font-weight:700;background:#eef2f7"><td colspan="4">Total</td><td class="num">${M(tD)}</td><td class="num">${M(tC)}</td><td class="num">${M(bl)}</td></tr>` : '<tr><td colspan="7" class="empty">No entries for this customer.</td></tr>');
  $("pBody").innerHTML = sch.map(x => `<tr><td>${x.inst_no}</td><td>${mon(x.due_month)}</td><td class="num">${M(x.due_amt)}</td><td class="num">${M(x.paid_amt)}</td><td class="num">${M(x.balance_due)}</td><td><span class="badge ${ST[x.status][0]}">${ST[x.status][1]}</span></td></tr>`).join("") || '<tr><td colspan="6" class="empty">No installment plan found for this customer.</td></tr>';
  $("bRec").href = "receipts.html"; $("bWa").disabled = !digits(c.mobile_number);
}
$("bWa").onclick = () => { const { c, b } = cur; let d = digits(c.mobile_number); d = d.startsWith("92") ? d : "92" + d.replace(/^0/, ""); const bl = N(b.balance);
  window.open(`https://wa.me/${d}?text=${encodeURIComponent(`Assalam o Alaikum ${c.account_title}, aap ki CAF ${c.account_no} ka baqaya Rs ${M(bl)} hai. Meherbani karke ada kar dein. Shukriya - Al Meezan`)}`, "_blank", "noopener"); };
$("bPrint").onclick = () => { $("prShop").textContent = ERP_CONFIG.APP_NAME.replace(" ERP", ""); $("prDate").textContent = new Date().toLocaleDateString("en-GB"); $("ledTab").hidden = false; window.print(); };
$("tL").onclick = () => { $("tL").setAttribute("aria-selected", true); $("tP").setAttribute("aria-selected", false); $("ledTab").hidden = false; $("planTab").hidden = true; };
$("tP").onclick = () => { $("tP").setAttribute("aria-selected", true); $("tL").setAttribute("aria-selected", false); $("ledTab").hidden = true; $("planTab").hidden = false; };
(async () => { await ERP.auth.guard(); try { LIST = await ERP.db.customers.balances(); } catch (e) { ERP.ui.toast("Could not load customers: " + e.message, "err"); }
  const a = new URLSearchParams(location.search).get("accNo") || new URLSearchParams(location.search).get("acc"); if (a) pick(a); else $("q").focus(); })();
</script>
</body>
</html>
