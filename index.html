<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>Al Meezan ERP</title>
<link rel="stylesheet" href="css/app.css">
<style>
  body{display:flex;height:100vh;height:100dvh;overflow:hidden}
  .shell-nav{width:250px;background:var(--nav);color:#f8fafc;display:flex;flex-direction:column;flex-shrink:0;z-index:50}
  .brand{display:block;width:100%;text-align:left;padding:16px;background:var(--nav-deep);color:#5eead4;font:inherit;font-weight:700;font-size:16px;border:0;border-bottom:1px solid var(--nav-hover);cursor:pointer}
  .menu{flex:1;overflow-y:auto;padding:6px 0}
  .menu h4{margin:12px 16px 4px;font-size:12px;color:#94a3b8;font-weight:600}
  .menu button{display:flex;gap:10px;align-items:center;width:100%;min-height:var(--tap);padding:8px 16px;background:none;border:0;border-left:4px solid transparent;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer}
  .menu button:hover{background:var(--nav-hover)}
  .menu button[aria-current="page"]{background:var(--nav-hover);border-left-color:#5eead4}
  .menu button[draggable="true"]{cursor:grab;touch-action:none}
  .menu button[draggable="true"]::after{content:"⋮⋮";margin-left:auto;color:#94a3b8;font-size:13px;letter-spacing:-3px;opacity:.75}
  .menu button[draggable="true"]:hover::after{color:#5eead4;opacity:1}
  .menu button.dragging{opacity:.4;cursor:grabbing}
  .menu button.drop-before{box-shadow:inset 0 3px #5eead4}
  .menu button.drop-after{box-shadow:inset 0 -3px #5eead4}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
  .topbar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .burger{display:inline-flex;align-items:center;justify-content:center;min-width:36px;width:36px;height:36px;padding:0;font-size:18px}
  @media(min-width:900px){body.sidebar-hidden .shell-nav{display:none}}
  .who{font-size:12px;color:var(--muted);white-space:nowrap}
  iframe{flex:1;width:100%;border:0;background:var(--bg)}
  .home{padding:16px;overflow:auto;flex:1}
  .home h2{margin:0 0 4px;font-size:22px}.home p.hi{margin:0 0 16px;color:var(--muted)}
  .home h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);min-height:88px;padding:12px;font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
  .tile:hover{border-color:var(--brand)} .tile b{display:block;font-size:24px;margin-bottom:2px}
  .password-form{display:grid;gap:12px}
  .password-form .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .password-status{min-height:20px;margin:0;font-size:13px}
  .password-status.error{color:var(--danger);font-weight:600}
  .bottom-bar{display:none}
  .scrim{display:none}
  @media(max-width:899px){
    .shell-nav{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s}
    body.open .shell-nav{transform:none}
    body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
    .burger{display:inline-flex}
    .bottom-bar{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
    .bottom-bar button{flex:1;min-height:58px;background:none;border:0;border-top:3px solid transparent;font:inherit;font-size:11px;color:var(--muted);cursor:pointer}
    .bottom-bar button[aria-current="page"]{border-top-color:var(--brand);color:var(--brand-dark);font-weight:700}
    .bottom-bar button b{display:block;font-size:20px}
  }
</style>
</head>
<body>
<nav class="shell-nav" id="nav" aria-label="Main menu">
  <button class="brand" id="brand" title="Go to Home">🏠 Al Meezan ERP</button>
  <div class="menu" id="menu"></div>
</nav>
<div class="scrim" id="scrim"></div>

<div class="main">
  <header class="topbar">
    <button class="btn ghost burger" id="burger" type="button" aria-label="Hide sidebar" aria-expanded="true" title="Hide sidebar">◀</button>
    <button class="btn ghost" id="homeBtn" hidden title="Back to Home">🏠 Home</button>
    <h1 id="title">Home</h1>
    <span class="who no-print" id="who"></span>
    <button class="btn ghost" id="passwordBtn" type="button" hidden>Change password</button>
    <button class="btn ghost" id="logout" hidden>Logout</button>
    <button class="btn ghost" id="newtab" title="Open this page in a new tab">Open in tab</button>
  </header>
  <section class="home" id="home"></section>
  <iframe id="frame" title="Page" hidden></iframe>
  <div class="bottom-bar" id="bar"></div>
</div>

<dialog id="passwordDialog" class="sheet">
  <div class="sh-head">
    <div><h2>Change password</h2><p>Choose a new password for your account.</p></div>
    <button class="x" id="passwordClose" type="button" aria-label="Close">✕</button>
  </div>
  <form id="passwordForm" class="sh-body password-form">
    <div class="fld"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div>
    <div class="fld"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div>
    <div id="passwordMessage" class="password-status" role="status" aria-live="polite"></div>
    <div class="actions"><button class="btn ghost" id="passwordCancel" type="button">Cancel</button><button class="btn" id="passwordSave" type="submit">Update password</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
/* Menu is data: add a page here and it appears in the sidebar, home tiles, bottom bar and routing. */
const GROUPS = [
  ["Daily work", [["receipts.html","💵","Receipts"],["SalesForm.html","🛒","Sales"],["customer.html","👤","Customers"],["FollowUp.html","📲","Customer Follow-up"],["LedgerView.html","📒","Customer Ledger"]]],
  ["Accounts", [["Accounts.html","📖","Accounts & Day Book"],["voucher_entry.html","🧾","Voucher Entry"],["ReconciliationView.html","🔄","Reconciliation"]]],
  ["System", [["Settings.html","⚙️","Settings"],["UserAccess.html","🔐","User Roles"]]],
  ["Inventory", [["ProductForm.html","📦","Products"],["PurchaseForm.html","🛍️","Purchases"],["StockLedger.html","📊","Stock Ledger"],["VenderLedger.html","🏭","Vendor Ledger"]]],
  ["Reports", [["DashboardView.html","📈","Dashboard"],["BusinessReports.html","📊","Business Reports"],["AgingReport2.html","💰","Recovery & Aging"],["cro_report.html","🖨️","CRO Report"]]]
];
const QUICK = ["receipts.html","SalesForm.html","customer.html","Accounts.html","Settings.html"];
const ALL = Object.fromEntries(GROUPS.flatMap(g => g[1]).map(p => [p[0], p]));
const $ = id => document.getElementById(id);
const mk = (cls, html, fn, key) => { const b = document.createElement("button"); b.className = cls || ""; b.innerHTML = html; b.dataset.p = key; b.onclick = fn; return b; };
function openPasswordDialog_() {
  $("passwordMessage").textContent = "";
  $("passwordMessage").className = "password-status";
  $("passwordForm").reset();
  $("passwordDialog").showModal();
  $("newPassword").focus();
}
ERP.db.sb.auth.onAuthStateChange(event => {
  if (event === "PASSWORD_RECOVERY") openPasswordDialog_();
});
const SIDEBAR_HIDDEN_KEY = "erp_sidebar_hidden";
function isMobileNav_() { return window.matchMedia("(max-width: 899px)").matches; }
function updateSidebarToggle_() {
  const isOpen = isMobileNav_() ? document.body.classList.contains("open") : !document.body.classList.contains("sidebar-hidden");
  const label = isMobileNav_()
    ? (isOpen ? "Close menu" : "Open menu")
    : (isOpen ? "Hide sidebar" : "Show sidebar");
  $("burger").textContent = isMobileNav_() ? (isOpen ? "✕" : "☰") : (isOpen ? "◀" : "☰");
  $("burger").setAttribute("aria-label", label);
  $("burger").setAttribute("title", label);
  $("burger").setAttribute("aria-expanded", String(isOpen));
}
try {
  document.body.classList.toggle("sidebar-hidden", localStorage.getItem(SIDEBAR_HIDDEN_KEY) === "true");
} catch (error) {
  ERP.ui.toast("Could not restore sidebar preference: " + error.message, "err");
}
updateSidebarToggle_();

const SIDEBAR_ORDER_KEY = "erp_sidebar_order";
function readSidebarOrder_() {
  try {
    const value = JSON.parse(localStorage.getItem(SIDEBAR_ORDER_KEY) || "{}");
    return value && typeof value === "object" && !Array.isArray(value) ? value : {};
  } catch (e) { return {}; }
}
function orderedPages_(name, pages) {
  const saved = readSidebarOrder_()[name];
  if (!Array.isArray(saved)) return pages;
  const positions = new Map(saved.map((key, index) => [key, index]));
  return [...pages].sort((a, b) =>
    (positions.get(a[0]) ?? Number.MAX_SAFE_INTEGER) - (positions.get(b[0]) ?? Number.MAX_SAFE_INTEGER));
}
function saveSidebarOrder_(group) {
  const order = readSidebarOrder_();
  order[group] = [...$("menu").querySelectorAll(`button[data-group="${CSS.escape(group)}"]`)].map(button => button.dataset.p);
  try { localStorage.setItem(SIDEBAR_ORDER_KEY, JSON.stringify(order)); }
  catch (e) { ERP.ui.toast("Could not save sidebar order: " + e.message, "err"); }
}

/* sidebar */
$("menu").appendChild(mk("", "🏠  Home", () => go(null), ""));
GROUPS.forEach(([name, pages]) => {
  const h = document.createElement("h4"); h.textContent = name; $("menu").appendChild(h);
  orderedPages_(name, pages).forEach(p => {
    const button = mk("", p[1] + "  " + p[2], () => go(p[0]), p[0]);
    button.dataset.group = name;
    button.draggable = true;
    button.title = "Drag to reorder within " + name;
    $("menu").appendChild(button);
  });
});
{ const h = document.createElement("h4"); h.textContent = "Data"; $("menu").appendChild(h);
  const bk = mk("", "💾  Backup all data (CSV)", () => ERP.ui.busy(bk, async () => { try { await ERP.db.backupAll(t => ERP.ui.toast("Exporting " + t + "...")); ERP.ui.toast("Backup done"); } catch (e) { ERP.ui.toast(e.message, "err"); } }), "backup");
  $("menu").appendChild(bk); }
{ const c = mk("", "🩺  Connection check", () => window.open("status.html", "_blank"), "status"); $("menu").appendChild(c); }
$("menu").addEventListener("dragstart", event => {
  const button = event.target.closest('button[draggable="true"]');
  if (!button) return;
  event.dataTransfer.effectAllowed = "move";
  event.dataTransfer.setData("text/plain", button.dataset.p);
  button.classList.add("dragging");
});
$("menu").addEventListener("dragover", event => {
  const target = event.target.closest('button[draggable="true"]');
  const dragged = $("menu").querySelector("button.dragging");
  if (!target || !dragged || target === dragged || target.dataset.group !== dragged.dataset.group) return;
  event.preventDefault();
  const rect = target.getBoundingClientRect();
  const before = event.clientY < rect.top + rect.height / 2;
  $("menu").querySelectorAll(".drop-before,.drop-after").forEach(button => button.classList.remove("drop-before", "drop-after"));
  target.classList.add(before ? "drop-before" : "drop-after");
});
$("menu").addEventListener("drop", event => {
  const target = event.target.closest('button[draggable="true"]');
  const dragged = $("menu").querySelector("button.dragging");
  if (!target || !dragged || target === dragged || target.dataset.group !== dragged.dataset.group) return;
  event.preventDefault();
  const rect = target.getBoundingClientRect();
  $("menu").insertBefore(dragged, event.clientY < rect.top + rect.height / 2 ? target : target.nextSibling);
  saveSidebarOrder_(dragged.dataset.group);
});
$("menu").addEventListener("dragend", () => {
  $("menu").querySelectorAll(".dragging,.drop-before,.drop-after").forEach(button =>
    button.classList.remove("dragging", "drop-before", "drop-after"));
});
/* bottom bar (phones) */
$("bar").appendChild(mk("", "<b>🏠</b>Home", () => go(null), ""));
QUICK.forEach(k => $("bar").appendChild(mk("", "<b>" + ALL[k][1] + "</b>" + ALL[k][2].split(" ")[0], () => go(k), k)));
/* home tiles, grouped */
$("home").innerHTML = '<h2>Welcome</h2><p class="hi">Choose what you want to open</p>';
GROUPS.forEach(([name, pages]) => {
  const h = document.createElement("h3"); h.textContent = name; $("home").appendChild(h);
  const g = document.createElement("div"); g.className = "tiles"; $("home").appendChild(g);
  pages.forEach(p => g.appendChild(mk("tile", "<b>" + p[1] + "</b>" + p[2], () => go(p[0]), p[0])));
});

/* routing: target may carry a query, e.g. LedgerView.html?accNo=786001 */
function mark(file) { document.querySelectorAll("[data-p]").forEach(b => (b.dataset.p === (file || "") && b.dataset.p !== "backup" && b.dataset.p !== "status") ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")); }
function show(file, target) {
  document.body.classList.remove("open"); updateSidebarToggle_(); const p = ALL[file];
  if (!p) { $("frame").hidden = true; $("frame").removeAttribute("src"); $("home").hidden = false; $("homeBtn").hidden = true; $("title").textContent = "Home"; mark(null); return; }
  if (!ERP.auth.can("read", ERP.auth.pageKey(file))) {
    ERP.ui.toast("You do not have permission to open this page.", "err");
    return;
  }
  $("home").hidden = true; $("frame").hidden = false; $("homeBtn").hidden = false; $("title").textContent = p[1] + " " + p[2]; mark(file);
  if ($("frame").getAttribute("src") !== target) $("frame").src = target;
  try { localStorage.setItem("erp_last", target); } catch (e) {}
}
function go(target, push = true) {
  target = target || ""; const file = target.split("?")[0];
  if (file && ALL[file] && !ERP.auth.can("read", ERP.auth.pageKey(file))) {
    ERP.ui.toast("You do not have permission to open this page.", "err");
    return;
  }
  if (push && location.hash.slice(1) !== target) history.pushState(null, "", "#" + target);
  show(file, target);
}
window.addEventListener("popstate", () => { const t = location.hash.slice(1); show(t.split("?")[0], t); });
/* a link clicked INSIDE a page (e.g. Ledger button) keeps the title and menu in step */
$("frame").onload = () => { try { const w = $("frame").contentWindow, f = w.location.pathname.split("/").pop(); if (ALL[f]) { const t = f + w.location.search; if (location.hash.slice(1) !== t) history.replaceState(null, "", "#" + t); $("title").textContent = ALL[f][1] + " " + ALL[f][2]; mark(f); } } catch (e) {} };

$("burger").onclick = () => {
  if (isMobileNav_()) {
    document.body.classList.toggle("open");
  } else {
    const hidden = document.body.classList.toggle("sidebar-hidden");
    try { localStorage.setItem(SIDEBAR_HIDDEN_KEY, String(hidden)); }
    catch (error) { ERP.ui.toast("Could not save sidebar preference: " + error.message, "err"); }
  }
  updateSidebarToggle_();
};
$("scrim").onclick = () => { document.body.classList.remove("open"); updateSidebarToggle_(); };
window.addEventListener("resize", () => {
  if (!isMobileNav_()) document.body.classList.remove("open");
  updateSidebarToggle_();
});
$("homeBtn").onclick = () => go(null); $("brand").onclick = () => go(null);
$("newtab").onclick = () => { const t = location.hash.slice(1); if (ALL[t.split("?")[0]]) window.open(t, "_blank"); };
$("logout").onclick = () => ERP.auth.signOut();
$("passwordBtn").onclick = openPasswordDialog_;
$("passwordClose").onclick = () => $("passwordDialog").close();
$("passwordCancel").onclick = () => $("passwordDialog").close();
$("passwordForm").addEventListener("submit", async event => {
  event.preventDefault();
  const password = $("newPassword").value;
  if (password.length < 8) {
    $("passwordMessage").textContent = "Password must be at least 8 characters.";
    $("passwordMessage").className = "password-status error";
    return;
  }
  if (password !== $("confirmPassword").value) {
    $("passwordMessage").textContent = "The passwords do not match.";
    $("passwordMessage").className = "password-status error";
    return;
  }
  const button = $("passwordSave");
  button.disabled = true;
  button.textContent = "Updating…";
  try {
    await ERP.auth.changePassword(password);
    $("passwordMessage").textContent = "Password updated successfully.";
    $("passwordMessage").className = "password-status";
    $("passwordForm").reset();
    window.setTimeout(() => $("passwordDialog").close(), 900);
  } catch (error) {
    $("passwordMessage").textContent = error.message;
    $("passwordMessage").className = "password-status error";
  } finally {
    button.disabled = false;
    button.textContent = "Update password";
  }
});
(async () => {
  if (!(ERP_CONFIG.OPEN_ACCESS === true) && !(await ERP.auth.session())) { location.replace("login.html"); return; }
  const p = await ERP.auth.guard();
  if (!p.open) { $("who").textContent = (p.full_name || p.email) + " (" + (p.roleDefinition ? p.roleDefinition.role_name : p.role) + ")"; $("logout").hidden = false; }
  if (p.role !== "admin") document.querySelectorAll('[data-p="backup"]').forEach(button => button.remove());
  document.querySelectorAll("[data-p]").forEach(button => {
    const key = ERP.auth.pageKey(button.dataset.p);
    if (key && !ERP.auth.can("read", key)) button.remove();
  });
  document.querySelectorAll("#menu h4").forEach(heading => {
    if (!heading.nextElementSibling || heading.nextElementSibling.tagName === "H4") heading.remove();
  });
  document.querySelectorAll("#home .tiles").forEach(group => {
    if (!group.children.length) {
      const heading = group.previousElementSibling;
      if (heading && heading.tagName === "H3") heading.remove();
      group.remove();
    }
  });
  $("logout").hidden = !!p.open;
  $("passwordBtn").hidden = !!p.open;
  $("who").textContent = p.open ? "Open access · roles inactive" : (p.full_name || p.email) + " (" + (p.roleDefinition ? p.roleDefinition.role_name : p.role) + ")";
  const t = location.hash.slice(1); show(t.split("?")[0], t);
})();
</script>
</body>
</html>
