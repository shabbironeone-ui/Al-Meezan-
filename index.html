<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>Al Meezan ERP</title>
<link rel="stylesheet" href="css/app.css">
<style>
  body{display:flex;height:100vh;height:100dvh;overflow:hidden}
  .shell-nav{width:250px;background:var(--nav);color:#f8fafc;display:flex;flex-direction:column;flex-shrink:0;z-index:50}
  .brand{padding:16px;background:var(--nav-deep);color:var(--brand);font-weight:700;border-bottom:1px solid var(--nav-hover)}
  .menu{flex:1;overflow-y:auto;padding:6px 0}
  .menu h4{margin:12px 16px 4px;font-size:12px;color:#94a3b8;font-weight:600}
  .menu button{display:flex;gap:10px;align-items:center;width:100%;min-height:var(--tap);padding:8px 16px;background:none;border:0;border-left:4px solid transparent;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer}
  .menu button:hover{background:var(--nav-hover)}
  .menu button[aria-current="page"]{background:var(--nav-hover);border-left-color:var(--brand)}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0}
  .topbar h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .burger{display:none;min-width:var(--tap)}
  .who{font-size:12px;color:var(--muted);white-space:nowrap}
  @media(max-width:700px){.who,#newtab{display:none}}
  iframe{flex:1;width:100%;border:0;background:var(--bg)}
  .home{padding:16px;overflow:auto;flex:1}
  .tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);min-height:84px;padding:12px;font:inherit;text-align:left;cursor:pointer}
  .tile:hover{border-color:var(--brand)} .tile b{display:block;font-size:22px}
  .bottom-bar{display:none}
  .scrim{display:none}
  @media(max-width:899px){
    .shell-nav{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s}
    body.open .shell-nav{transform:none}
    body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
    .burger{display:inline-block}
    .bottom-bar{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
    .bottom-bar button{flex:1;min-height:56px;background:none;border:0;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
    .bottom-bar button b{display:block;font-size:20px}
  }
</style>
</head>
<body>
<nav class="shell-nav" id="nav" aria-label="Main menu">
  <div class="brand">Al Meezan ERP</div>
  <div class="menu" id="menu"></div>
</nav>
<div class="scrim" id="scrim"></div>

<div class="main">
  <header class="topbar">
    <button class="btn ghost burger" id="burger" aria-label="Open menu">☰</button>
    <h1 id="title">Home</h1>
    <span class="who no-print" id="who"></span>
    <button class="btn ghost" id="logout" hidden>Logout</button>
    <button class="btn ghost" id="newtab" title="Open this page in a new tab">Open in tab</button>
  </header>
  <section class="home" id="home"></section>
  <iframe id="frame" title="Page" hidden></iframe>
  <div class="bottom-bar" id="bar"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
/* Menu is data: add a page here and it appears in the sidebar, home tiles and routing. */
const GROUPS = [
  ["Sales & Customers", [["customer.html","👤","Customers"],["SalesForm.html","🛒","Sales"],["LedgerView.html","📒","Customer Ledger"]]],
  ["Accounts", [["receipts.html","💵","Receipts"],["Accounts.html","📖","Accounts & Day Book"],["ReconciliationView.html","🔄","Reconciliation"]]],
  ["Inventory", [["ProductForm.html","📦","Products"],["PurchaseForm.html","🛍️","Purchases"],["StockLedger.html","📊","Stock Ledger"],["VenderLedger.html","🏭","Vendor Ledger"]]],
  ["Reports", [["DashboardView.html","📈","Dashboard"],["DailyRecoveryReport.html","💰","Daily Recovery"],["AgingReport2.html","⏳","Aging Report"]]]
];
const QUICK = ["DashboardView.html","receipts.html","SalesForm.html","customer.html"];
const ALL = Object.fromEntries(GROUPS.flatMap(g => g[1]).map(p => [p[0], p]));
const $ = id => document.getElementById(id);

function btn(p, cls) { const b = document.createElement("button"); b.dataset.p = p[0]; b.className = cls || ""; return b; }

const bk = document.createElement("button"); bk.textContent = "💾  Backup all data (CSV)";
bk.onclick = () => ERP.ui.busy(bk, async () => { try { await ERP.db.backupAll(t => ERP.ui.toast("Exporting " + t + "...")); ERP.ui.toast("Backup done"); } catch (e) { ERP.ui.toast(e.message, "err"); } });
GROUPS.forEach(([name, pages]) => {
  const h = document.createElement("h4"); h.textContent = name; $("menu").appendChild(h);
  pages.forEach(p => { const b = btn(p); b.textContent = p[1] + "  " + p[2]; b.onclick = () => go(p[0]); $("menu").appendChild(b); });
});
{ const h = document.createElement("h4"); h.textContent = "Data"; $("menu").appendChild(h); $("menu").appendChild(bk); }
QUICK.forEach(k => { const p = ALL[k], b = btn(p); b.innerHTML = "<b>" + p[1] + "</b>" + p[2]; b.onclick = () => go(k); $("bar").appendChild(b); });
GROUPS.flatMap(g => g[1]).forEach(p => { const b = btn(p, "tile"); b.innerHTML = "<b>" + p[1] + "</b>" + p[2]; b.onclick = () => go(p[0]); $("home").appendChild(Object.assign(document.createElement("div"), {className: "tiles"})).appendChild(b); });
/* merge tiles into one grid */
const tiles = $("home").querySelectorAll(".tiles"); const first = tiles[0]; tiles.forEach((t, i) => { if (i) first.appendChild(t.firstChild), t.remove(); });

function go(file) {
  const p = ALL[file]; document.body.classList.remove("open");
  if (!p) { $("frame").hidden = true; $("home").hidden = false; $("title").textContent = "Home"; history.replaceState(null, "", "#"); mark(null); return; }
  $("home").hidden = true; $("frame").hidden = false; $("frame").src = file;
  $("title").textContent = p[1] + " " + p[2]; history.replaceState(null, "", "#" + file); mark(file);
  try { localStorage.setItem("erp_last", file); } catch (e) {}
}
function mark(file) { document.querySelectorAll("[data-p]").forEach(b => b.dataset.p === file ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")); }

$("burger").onclick = () => document.body.classList.add("open");
$("scrim").onclick = () => document.body.classList.remove("open");
$("newtab").onclick = () => { const f = location.hash.slice(1); if (ALL[f]) window.open(f, "_blank"); };
$("title").onclick = () => go(null);
$("logout").onclick = () => ERP.auth.signOut();
ERP.auth.guard().then(p => {
  if (!p.open) { $("who").textContent = (p.full_name || p.email) + " (" + p.role + ")"; $("logout").hidden = false; }
  go(location.hash.slice(1) || null);
});
</script>
</body>
</html>
