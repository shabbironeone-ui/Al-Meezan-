<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body { font-family: Arial, sans-serif; margin: 15px; color: #333; }
      .filter-container { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
      
      .table-container {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid #ddd;
        position: relative;
      }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
      
      th { 
        background-color: #f4f4f4; 
        position: sticky; 
        top: 0; 
        z-index: 10; 
        box-shadow: inset 0 -1px 0 #ddd;
      }
      
      .text-right { text-align: right; }
      .opening-row { background-color: #fafafa; font-weight: bold; font-style: italic; }

      #loadingOverlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.8);
        z-index: 100;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .config-box { background: #fff3cd; border: 1px solid #ffe69c; padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 11px; display: none; }
      .config-box.show { display: block; }
      .config-box input { width: 100%; padding: 6px 8px; margin-top: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; box-sizing: border-box; }
      .config-box button { margin-top: 6px; padding: 6px 14px; background: #1b5e20; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
    
    .auto-mic-wrap { position: relative; display: inline-block; width: 100%; }
    .auto-mic-btn {
      position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px; padding: 0; border: none; background: transparent;
      cursor: pointer; font-size: 12px; line-height: 1; z-index: 5; opacity: 0.55;
      display: flex; align-items: center; justify-content: center;
    }
    .auto-mic-btn:hover { opacity: 1; }
    .auto-mic-btn.listening {
      background: #c62828; border-radius: 50%; color: #fff; opacity: 1;
      animation: autoMicPulse 1s infinite;
    }
    @keyframes autoMicPulse {
      0% { box-shadow: 0 0 0 0 rgba(198,40,40,0.5); }
      70% { box-shadow: 0 0 0 6px rgba(198,40,40,0); }
      100% { box-shadow: 0 0 0 0 rgba(198,40,40,0); }
    }
</style>
  </head>
  <body>

      <div class="change-url-link" onclick="showUrlConfig()">&#9881; Change Deployment URL</div>
  <div id="configBox" class="config-box">
      <b>Setup:</b> Agar data load na ho to apna Apps Script URL neeche update karein.
      <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/XXXXXXXX/exec">
      <button onclick="saveScriptUrl()">Save URL</button>
    </div>

    <h3>Daily Day Book Report</h3>

    <div class="filter-container">
      <label>From: <input type="date" id="startDate"></label>
      <label>To: <input type="date" id="endDate"></label>
      <button onclick="onFilterClick()">Filter</button>
      <button onclick="resetFilters()" style="background: #f0f0f0; border: 1px solid #ccc; cursor: pointer;">Reset</button>
    </div>

    <div class="table-container">
      <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="margin-top: 5px; font-size: 12px; font-weight: bold;">Processing...</div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Voucher</th>
            <th>Type</th>
            <th>Acc No</th>
            <th>Title</th>
            <th>Particulars</th>
            <th class="text-right">Debit</th>
            <th class="text-right">Credit</th>
            <th class="text-right">Balance</th>
          </tr>
        </thead>
        <tbody id="dayBookTableBody">
          <tr><td colspan="9" style="text-align:center;">Loading data...</td></tr>
        </tbody>
      </table>
    </div>

    <div style="margin-top: 15px; font-weight: bold; text-align: right;">
      Closing Balance: <span id="closingBalanceDisplay">0</span>
    </div>

    <script>
      let SCRIPT_URL = localStorage.getItem('erp_script_url') || "";

      function saveScriptUrl() {
        const val = document.getElementById('scriptUrlInput').value.trim();
        if (!val) { alert("URL enter karein"); return; }
        SCRIPT_URL = val;
        localStorage.setItem('erp_script_url', val);
        document.getElementById('configBox').classList.remove('show');
        loadDayBookData();
      }

      let allEntries = [];

      function loadDayBookData() {
        showLoader(true);
        fetch(SCRIPT_URL + "?action=getDayBookData")
          .then(res => res.json())
          .then(response => {
            showLoader(false);
            if (response.success) {
              allEntries = response.entries;

              if (allEntries.length > 0) {
                let lastItem = allEntries[allEntries.length - 1];
                let parts = lastItem.date.split("-");
                let lastDateStr = parts[2] + "-" + parts[1] + "-" + parts[0];

                document.getElementById("startDate").value = lastDateStr;
                document.getElementById("endDate").value = lastDateStr;
              }

              applyFilterAndRender();
            } else {
              alert(response.message);
            }
          })
          .catch(err => {
            showLoader(false);
            alert("Server Error: " + err.message);
          });
      }

      document.addEventListener("DOMContentLoaded", function() {
        loadDayBookData();
      });

      function showLoader(show) {
        document.getElementById("loadingOverlay").style.display = show ? "flex" : "none";
      }

      function onFilterClick() {
        showLoader(true);
        setTimeout(function() {
          applyFilterAndRender();
          showLoader(false);
        }, 150);
      }

      function applyFilterAndRender() {
        const startVal = document.getElementById("startDate").value;
        const endVal = document.getElementById("endDate").value;

        let openingBalance = 0;
        let cumulativeBalanceBeforeStart = 0;

        if (startVal) {
          allEntries.forEach(function(item) {
            let parts = item.date.split("-");
            let itemDateStr = parts[2] + "-" + parts[1] + "-" + parts[0];
            if (itemDateStr < startVal) {
              cumulativeBalanceBeforeStart += (item.debit - item.credit);
            }
          });
          openingBalance = cumulativeBalanceBeforeStart;
        }

        let filtered = allEntries.filter(function(item) {
          let parts = item.date.split("-");
          let itemDateStr = parts[2] + "-" + parts[1] + "-" + parts[0];

          if (startVal && itemDateStr < startVal) return false;
          if (endVal && itemDateStr > endVal) return false;
          return true;
        });

        let runningBalance = openingBalance;
        let adjustedEntries = filtered.map(function(item) {
          runningBalance += (item.debit - item.credit);
          return {
            date: item.date,
            voucherNo: item.voucherNo,
            type: item.type,
            accNo: item.accNo,
            accTitle: item.accTitle,
            particulars: item.particulars,
            debit: item.debit,
            credit: item.credit,
            balance: runningBalance
          };
        });

        renderDayBookTable(adjustedEntries, openingBalance, runningBalance);
      }

      function renderDayBookTable(entries, openingBalance, closingBalance) {
        const tbody = document.getElementById("dayBookTableBody");
        tbody.innerHTML = "";
        
        const startVal = document.getElementById("startDate").value;
        if (startVal) {
          let openingTr = document.createElement("tr");
          openingTr.className = "opening-row";
          openingTr.innerHTML = `
            <td>-</td>
            <td>-</td>
            <td>OPENING</td>
            <td>-</td>
            <td>Opening Balance</td>
            <td>B/F from previous period</td>
            <td class="text-right">-</td>
            <td class="text-right">-</td>
            <td class="text-right">${openingBalance.toLocaleString()}</td>
          `;
          tbody.appendChild(openingTr);
        }

        if (entries.length === 0 && !startVal) {
          tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;">No records found</td></tr>`;
          document.getElementById("closingBalanceDisplay").textContent = "0";
          return;
        }

        entries.forEach(function(row) {
          let tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.date}</td>
            <td>${row.voucherNo}</td>
            <td>${row.type}</td>
            <td>${row.accNo}</td>
            <td>${row.accTitle}</td>
            <td>${row.particulars}</td>
            <td class="text-right">${row.debit > 0 ? row.debit.toLocaleString() : "-"}</td>
            <td class="text-right">${row.credit > 0 ? row.credit.toLocaleString() : "-"}</td>
            <td class="text-right" style="font-weight:bold;">${row.balance.toLocaleString()}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById("closingBalanceDisplay").textContent = closingBalance.toLocaleString();
      }

      function resetFilters() {
        showLoader(true);
        if (allEntries.length > 0) {
          let lastItem = allEntries[allEntries.length - 1];
          let parts = lastItem.date.split("-");
          let lastDateStr = parts[2] + "-" + parts[1] + "-" + parts[0];
          document.getElementById("startDate").value = lastDateStr;
          document.getElementById("endDate").value = lastDateStr;
        } else {
          document.getElementById("startDate").value = "";
          document.getElementById("endDate").value = "";
        }
        setTimeout(function() {
          applyFilterAndRender();
          showLoader(false);
        }, 150);
      }
    
    // ===== Deployment URL config (auto-added) =====
    function showUrlConfig() {
      var inp = document.getElementById('scriptUrlInput');
      if (inp) inp.value = (typeof SCRIPT_URL !== 'undefined' ? SCRIPT_URL : (typeof WEB_APP_URL !== 'undefined' ? WEB_APP_URL : ''));
      var box = document.getElementById('configBox');
      if (box) box.classList.add('show');
    }
    function saveScriptUrl() {
      var inp = document.getElementById('scriptUrlInput');
      var val = inp ? inp.value.trim() : '';
      if (!val) { alert("URL enter karein"); return; }
      localStorage.setItem('erp_script_url', val);
      location.reload();
    }
    document.addEventListener('DOMContentLoaded', function() {
      var savedUrl = localStorage.getItem('erp_script_url');
      if (!savedUrl) {
        var box = document.getElementById('configBox');
        if (box) box.classList.add('show');
      }
    });

    // ================= UNIVERSAL MIC INPUT (auto-added) =================
    (function() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let activeRec = null, activeBtn = null, activeInput = null;

      function cleanNumeric(t) { return t.replace(/[^\d\-]/g, '').trim(); }

      function stopActiveMic() {
        if (activeRec) {
          activeRec.onend = null; activeRec.onresult = null;
          try { activeRec.abort(); } catch (e) {}
          activeRec = null;
        }
        if (activeBtn) activeBtn.classList.remove('listening');
        if (activeInput) activeInput.placeholder = activeInput.dataset.origPh || activeInput.placeholder;
        activeBtn = null; activeInput = null;
      }

      function toggleMic(input, btn) {
        if (!SR) { alert('Ye browser voice input support nahi karta. Chrome use karein.'); return; }
        const isNumeric = input.type === 'number';

        if (btn.classList.contains('listening')) { stopActiveMic(); return; }
        stopActiveMic();

        const rec = new SR();
        rec.lang = 'en-US';
        rec.continuous = true;
        rec.interimResults = true;
        let finalText = '';

        activeRec = rec; activeBtn = btn; activeInput = input;
        btn.classList.add('listening');
        input.dataset.origPh = input.placeholder || '';
        input.placeholder = 'Sun raha hoon... rokne ke liye mic dobara dabayein';

        rec.onresult = function(ev) {
          let interim = '';
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const t = ev.results[i][0].transcript;
            if (ev.results[i].isFinal) finalText += t + ' '; else interim += t;
          }
          let text = (finalText + interim).trim();
          if (isNumeric) text = cleanNumeric(text);
          input.value = text;
          input.dispatchEvent(new Event('input', { bubbles: true }));
        };
        rec.onerror = function(ev) {
          if (ev.error !== 'no-speech' && ev.error !== 'aborted') console.error('Mic error:', ev.error);
        };
        rec.onend = function() {
          btn.classList.remove('listening');
          input.placeholder = input.dataset.origPh || '';
          if (isNumeric) input.value = cleanNumeric(input.value);
          if (activeInput === input) { activeRec = null; activeBtn = null; activeInput = null; }
        };
        try { rec.start(); } catch (e) {}
      }

      function attachMic(input) {
        if (!input || input.dataset.autoMic) return;
        if (input.type === 'date' || input.type === 'hidden' || input.type === 'checkbox' ||
            input.type === 'radio' || input.type === 'file' || input.readOnly || input.disabled) return;
        if (input.closest('#configBox')) return;
        if (input.closest('.input-with-mic')) return; // already has a manual mic button
        if (input.parentElement && input.parentElement.querySelector('.mic-btn')) return;

        input.dataset.autoMic = '1';

        const wrap = document.createElement('span');
        wrap.className = 'auto-mic-wrap';
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);

        const curPad = window.getComputedStyle(input).paddingRight;
        input.style.paddingRight = '24px';
        input.style.boxSizing = 'border-box';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'auto-mic-btn';
        btn.title = 'Voice input';
        btn.innerHTML = '&#127908;';
        btn.onclick = function(e) { e.preventDefault(); e.stopPropagation(); toggleMic(input, btn); };
        wrap.appendChild(btn);
      }

      function scanAndAttach(root) {
        root.querySelectorAll('input[type="text"], input[type="number"], input:not([type])').forEach(attachMic);
      }

      document.addEventListener('DOMContentLoaded', function() {
        scanAndAttach(document);
      });

      const mo = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            if (node.nodeType !== 1) return;
            if (node.matches && (node.matches('input[type="text"]') || node.matches('input[type="number"]') || node.matches('input:not([type])'))) {
              attachMic(node);
            }
            if (node.querySelectorAll) scanAndAttach(node);
          });
        });
      });
      mo.observe(document.body, { childList: true, subtree: true });
    })();
</script>
  </body>
</html>
