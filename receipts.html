<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipts</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .tabs{display:inline-flex;background:#e8edf3;border-radius:12px;padding:4px;margin-bottom:12px}
  .tabs button{min-height:40px;padding:6px 18px;border:0;border-radius:9px;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--brand-dark);box-shadow:var(--shadow)}
  .hdr{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media(min-width:760px){.hdr{grid-template-columns:150px 140px 1fr 1.4fr}}
  .hdr .wide{grid-column:1/-1}@media(min-width:760px){.hdr .wide{grid-column:auto}}
  .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}.tags small{color:var(--muted);font-weight:600}
  .rrow{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .rgrid{display:grid;gap:8px;grid-template-columns:1fr 1fr auto}
  .rgrid .acc{grid-column:1/-1}
  @media(min-width:760px){.rgrid{grid-template-columns:160px 1fr 140px auto}.rgrid .acc{grid-column:auto}}
  .rgrid label{font-size:11px}.rgrid .del{align-self:end;min-width:44px}
  .rinfo{margin-top:6px;font-size:13px;color:var(--muted);min-height:20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .rinfo b{color:var(--ink)}
  .sumbar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));margin:0 -12px;box-shadow:0 -6px 18px rgba(15,23,42,.08);z-index:5}
  .sumbar b{font-size:20px;font-variant-numeric:tabular-nums}.sumbar small{color:var(--muted);display:block}
  .ft{display:grid;gap:8px;grid-template-columns:1fr 1fr;padding:12px;align-items:end}
  @media(min-width:900px){.ft{grid-template-columns:140px 140px 1.4fr 1fr 1fr auto}}
  .ft .wide{grid-column:1/-1}@media(min-width:900px){.ft .wide{grid-column:auto}}
  td .badge{white-space:nowrap}
  .selbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}
  .tr-click{cursor:pointer}.tr-click:hover td{background:#f8fafc}
  @media print{body{background:#fff}.page>*:not(#pList){display:none!important}#pList .no-print,.ft,.tabs,.selbar{display:none!important}th:first-child,td:first-child,th:last-child,td:last-child{display:none}.table-wrap{border:0;overflow:visible}table{min-width:0;font-size:11px}}
</style>
</head>
<body>
<main class="page">
  <header class="appbar"><div><h1>Receipts</h1><p>Recovery from customers</p></div></header>
  <div class="tabs" role="tablist"><button role="tab" id="tNew" aria-selected="true">New receipts</button><button role="tab" id="tList" aria-selected="false">All receipts</button></div>

  <!-- ENTRY -->
  <section id="pNew">
    <div class="card"><div class="hdr">
      <div><label for="rDate">Receipt date</label><input id="rDate" type="date"></div>
      <div><label for="rType">Type</label><select id="rType"><option>Cash</option><option>Bank</option></select></div>
      <div><label for="rMode">Account / pay mode</label><select id="rMode"></select></div>
      <div class="wide"><label for="rRem">Remarks (for all rows)</label><input id="rRem" autocomplete="off"></div></div></div>
    <div class="tags"><small>Quick receipt no:</small><span id="tags"></span></div>
    <div id="rows"></div>
    <button class="btn soft" id="addRow" style="width:100%;margin-bottom:12px">＋ Add row</button>
    <div class="sumbar"><div><small id="sCount">0 receipts</small><b id="sTotal">Rs 0</b></div><button class="btn" id="btnSave">Save receipts</button></div>
  </section>

  <!-- LIST -->
  <section id="pList" hidden>
    <div class="card ft">
      <div><label>From</label><input type="date" id="fFrom"></div><div><label>To</label><input type="date" id="fTo"></div>
      <div class="wide"><label>Search</label><input id="fQ" type="search" placeholder="Receipt no, account no or name"></div>
      <div><label>Account / mode</label><select id="fMode"></select></div>
      <div><label>Head</label><select id="fHead"></select></div>
      <button class="btn ghost no-print" id="btnPrint">Print</button></div>
    <div class="selbar no-print"><span id="lSum" style="color:var(--muted);font-size:13px"></span><button class="btn sm danger" id="btnBulk" hidden>Delete selected</button></div>
    <div class="table-wrap"><table><thead><tr><th style="width:36px"><input type="checkbox" id="selAll" aria-label="Select all"></th><th>Date</th><th>Receipt</th><th>Account</th><th>Name</th><th>Head</th><th>Mode</th><th class="num">Amount</th></tr></thead><tbody id="lBody"></tbody></table></div>
    <div style="text-align:center;margin:8px 0 24px"><button class="btn ghost" id="more" hidden></button></div>
  </section>
</main>

<dialog id="dlg" class="sheet"><div class="sh-head"><div><h2>Edit receipt</h2><p id="dSub"></p></div><button class="x" data-close>✕</button></div>
  <form class="sh-body" onsubmit="return false"><div class="fsec"><div class="fgrid">
    <div><label>Date</label><input id="eDate" type="date"></div><div><label>Receipt no</label><input id="eRct"></div>
    <div><label>Account no</label><input id="eAcc" inputmode="numeric"><small class="err" id="eAccErr"></small></div><div><label>Customer name</label><input id="eTitle"></div>
    <div><label>Head</label><input id="eHead" list="dHead"></div><div><label>Account / pay mode</label><select id="eMode"></select></div>
    <div><label>Amount (Rs)</label><input id="eAmt" type="number" inputmode="decimal" min="0"></div><div><label>Remarks</label><input id="eRem"></div></div></div></form>
  <div class="sh-foot"><button class="btn danger" id="eDel" hidden style="margin-right:auto">Delete</button><button class="btn ghost" data-close>Cancel</button><button class="btn" id="eSave">Save changes</button></div>
  <datalist id="dHead"></datalist></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script><script src="js/voice.js"></script>
<script>
const $ = id => document.getElementById(id), E = ERP.ui.esc, M = ERP.ui.money, PM = ERP_CONFIG.PAY_MODES, TAGS = ERP_CONFIG.QUICK_RECEIPT_TAGS;
const SPECIAL = ERP_CONFIG.SPECIAL_RECEIPT_NOS, isTag = v => SPECIAL.some(t => t.toLowerCase() === String(v).trim().toLowerCase());
let CUST = new Map(), DUES = new Map(), REC = [], shown = 100, editing = null, lastRct = null;
document.addEventListener("click", e => { const d = e.target.closest("dialog"); if (e.target.closest("[data-close]") && d) d.close(); });

/* ---------- entry rows ---------- */
function addRow(prefill = {}) {
  const prev = [...document.querySelectorAll("#rows .rct")].pop();
  const rct = prefill.rct ?? (prev && !isTag(prev.value) ? prev.value : "");
  const d = document.createElement("div"); d.className = "rrow";
  d.innerHTML = `<div class="rgrid">
    <div class="acc"><label>Account no</label><div class="inp"><input class="acc-in" value="786" inputmode="numeric" autocomplete="off"><button type="button" class="mic" tabindex="-1" aria-label="Voice">🎤</button></div></div>
    <div><label>Receipt no</label><input class="rct" value="${E(rct)}" list="dTags" autocomplete="off"></div>
    <div><label>Amount</label><input class="amt" type="number" inputmode="decimal" min="0"></div>
    <button type="button" class="btn sm ghost del" aria-label="Remove row" style="color:var(--danger)">✕</button></div>
    <div class="rinfo"></div>`;
  $("rows").appendChild(d); ERP.voice.wire(d); totals(); return d;
}
function lookup(row) {
  const acc = row.querySelector(".acc-in").value.trim(), info = row.querySelector(".rinfo"), c = CUST.get(acc);
  row._c = c || null;
  if (!acc || acc === "786" || acc.length < 5) { info.innerHTML = ""; return; }
  if (!c) { info.innerHTML = '<span class="badge bad">Account not found</span>'; return; }
  const b = Number(c.balance) || 0, inst = Number(c.installment) || 0;
  const d = DUES.get(acc), mk = (t, tag, v) => Number(v) > 0 ? `<button type="button" class="chip" style="min-height:30px;padding:0 10px" data-due="${tag}|${v}">${t} ${M(v)}</button>` : "";
  info.innerHTML = `<b>${E(c.account_title)}</b>${inst ? `<span>· Inst Rs ${M(inst)}</span>` : ""}<span class="badge ${b > 0 ? "warn" : "ok"}">${b > 0 ? "Balance Rs " + M(b) : "Clear"}</span>` + (d ? mk("Advance due", "Advance", d.advance_due) + mk("Fee due", "Processing Fee", d.fee_due) + mk("1st inst due", "1st Installment", d.first_due) : "");
}
function totals() {
  let n = 0, t = 0; document.querySelectorAll("#rows .rrow").forEach(r => { const a = +r.querySelector(".amt").value || 0; if (a > 0) { n++; t += a; } });
  $("sCount").textContent = n + " receipt" + (n === 1 ? "" : "s"); $("sTotal").textContent = "Rs " + M(t);
}
$("rows").addEventListener("input", e => { const r = e.target.closest(".rrow"); if (!r) return; if (e.target.matches(".acc-in")) lookup(r); totals(); });
$("rows").addEventListener("click", e => { const b = e.target.closest("[data-due]"); if (!b) return; const r = b.closest(".rrow"), [tag, v] = b.dataset.due.split("|"); r.querySelector(".rct").value = tag; r.querySelector(".amt").value = v; totals(); r.querySelector(".amt").focus(); });
$("rows").addEventListener("focusin", e => { if (e.target.matches(".rct")) lastRct = e.target; });
$("rows").addEventListener("click", e => { const r = e.target.closest(".rrow"); if (r && e.target.closest(".del")) { if (document.querySelectorAll("#rows .rrow").length > 1) { r.remove(); totals(); } else { r.querySelector(".amt").value = ""; r.querySelector(".acc-in").value = "786"; lookup(r); totals(); } } });
$("rows").addEventListener("keydown", e => {   // Enter flows: account -> receipt no -> amount -> next row
  if (e.key !== "Enter") return; const r = e.target.closest(".rrow"); if (!r) return; e.preventDefault();
  if (e.target.matches(".acc-in")) r.querySelector(".rct").focus();
  else if (e.target.matches(".rct")) r.querySelector(".amt").focus();
  else if (e.target.matches(".amt")) { const n = r.nextElementSibling && r.nextElementSibling.classList.contains("rrow") ? r.nextElementSibling : addRow(); n.querySelector(".acc-in").focus(); n.querySelector(".acc-in").select(); }
});
$("addRow").onclick = () => addRow().querySelector(".acc-in").focus();
$("tags").innerHTML = TAGS.map(t => `<button type="button" class="chip" style="min-height:34px;padding:2px 12px" data-t="${E(t)}">${E(t)}</button>`).join("");
$("tags").onclick = e => { const b = e.target.closest("[data-t]"); if (!b) return; const t = lastRct && document.body.contains(lastRct) ? lastRct : document.querySelector("#rows .rct"); t.value = b.dataset.t; t.focus(); };
const dl = document.createElement("datalist"); dl.id = "dTags"; dl.innerHTML = TAGS.map(t => `<option value="${E(t)}">`).join(""); document.body.appendChild(dl);

function fillModes(sel, type, withAll) {
  const list = type ? PM[type.toLowerCase()] : [...PM.cash, ...PM.bank];
  sel.innerHTML = (withAll ? '<option value="">All</option>' : "") + list.map(x => `<option>${E(x)}</option>`).join("");
}
$("rType").onchange = () => fillModes($("rMode"), $("rType").value);

function resetEntry() { $("rows").innerHTML = ""; addRow({ rct: "" }); $("rRem").value = ""; $("rDate").value = ERP.ui.today(); totals(); }
$("btnSave").onclick = () => ERP.ui.busy($("btnSave"), async () => {
  const date = $("rDate").value; if (!date) return ERP.ui.toast("Select the receipt date", "err");
  const recs = [], seen = new Set(), vnos = []; let bad = null;
  document.querySelectorAll("#rows .rrow").forEach((r, i) => { if (bad) return;
    const acc = r.querySelector(".acc-in").value.trim(), rct = r.querySelector(".rct").value.trim(), amt = +r.querySelector(".amt").value || 0;
    if ((acc === "786" || !acc) && !rct && !amt) return;            // untouched row
    if (!CUST.get(acc)) bad = [r, `Row ${i + 1}: account ${acc} not found`]; else if (!rct) bad = [r, `Row ${i + 1}: enter the receipt number`];
    else if (!(amt > 0)) bad = [r, `Row ${i + 1}: enter the amount`];
    else if (!isTag(rct) && seen.has(rct.toLowerCase())) bad = [r, `Receipt no ${rct} is repeated in this list`];
    else { seen.add(rct.toLowerCase()); if (!isTag(rct)) vnos.push(rct);
      recs.push({ voucher_no: rct, date, account_no: acc, account_title: CUST.get(acc).account_title, account_head: "Recovery", pay_mode: $("rMode").value, amount: amt, remarks: $("rRem").value.trim() }); } });
  if (bad) { bad[0].scrollIntoView({ block: "center" }); return ERP.ui.toast(bad[1], "err"); }
  if (!recs.length) return ERP.ui.toast("Enter at least one complete receipt", "err");
  try {
    if (vnos.length) { const dup = await ERP.db.receipts.existing(vnos); if (dup.length) return ERP.ui.toast("Already saved: " + [...new Set(dup)].join(", "), "err"); }
    await ERP.db.receipts.add(recs); ERP.ui.toast(recs.length + " receipt" + (recs.length > 1 ? "s" : "") + " saved"); resetEntry(); loadCust(); loadList();
  } catch (e) { ERP.ui.toast(e.message, "err"); }
});

/* ---------- list ---------- */
async function loadList() {
  $("lBody").innerHTML = '<tr><td colspan="8"><div class="skeleton"></div></td></tr>';
  try { REC = await ERP.db.receipts.list({ from: $("fFrom").value, to: $("fTo").value }); shown = 100;
    const heads = [...new Set(REC.map(r => r.account_head).filter(Boolean))].sort(), modes = [...new Set([...PM.cash, ...PM.bank, ...REC.map(r => r.pay_mode).filter(Boolean)])];
    const hv = $("fHead").value, mv = $("fMode").value;
    $("fHead").innerHTML = '<option value="">All</option>' + heads.map(h => `<option>${E(h)}</option>`).join(""); $("fHead").value = hv;
    $("fMode").innerHTML = '<option value="">All</option>' + modes.map(h => `<option>${E(h)}</option>`).join(""); $("fMode").value = mv;
    $("dHead").innerHTML = heads.map(h => `<option value="${E(h)}">`).join(""); renderList();
  } catch (e) { $("lBody").innerHTML = `<tr><td colspan="8">${E(e.message)}</td></tr>`; }
}
const filtered = () => { const q = $("fQ").value.trim().toLowerCase(), m = $("fMode").value, h = $("fHead").value;
  return REC.filter(r => (!m || r.pay_mode === m) && (!h || r.account_head === h) && (!q || [r.voucher_no, r.account_no, r.account_title].join(" ").toLowerCase().includes(q))); };
function renderList() {
  const rows = filtered(), tot = rows.reduce((s, r) => s + (+r.amount || 0), 0);
  $("lSum").textContent = `${M(rows.length)} receipts · Rs ${M(tot)}`; $("selAll").checked = false; $("btnBulk").hidden = true;
  $("lBody").innerHTML = rows.slice(0, shown).map(r => `<tr class="tr-click" data-id="${r.id}"><td><input type="checkbox" class="sel" value="${r.id}" aria-label="Select"></td><td>${E(r.date)}</td><td>${E(r.voucher_no)}</td><td>${E(r.account_no)}</td><td>${E(r.account_title)}</td><td>${E(r.account_head)}</td><td>${E(r.pay_mode)}</td><td class="num"><b>${M(r.amount)}</b></td></tr>`).join("")
    || '<tr><td colspan="8" class="empty">No receipts found.</td></tr>';
  $("more").hidden = rows.length <= shown; $("more").textContent = `Show more (${M(rows.length - shown)} remaining)`;
}
function updBulk() { const n = document.querySelectorAll(".sel:checked").length; $("btnBulk").hidden = !(n && ERP.auth.can("delete")); $("btnBulk").textContent = `Delete selected (${n})`; }
$("lBody").onclick = e => { if (e.target.classList.contains("sel")) return updBulk(); const tr = e.target.closest("tr[data-id]"); if (tr && ERP.auth.can("edit")) openEdit(REC.find(r => String(r.id) === tr.dataset.id)); };
$("selAll").onchange = e => { document.querySelectorAll(".sel").forEach(c => c.checked = e.target.checked); updBulk(); };
$("btnBulk").onclick = async () => { const ids = [...document.querySelectorAll(".sel:checked")].map(c => Number(c.value));
  if (!confirm(`Delete ${ids.length} receipt(s)? This cannot be undone.`)) return;
  try { await ERP.db.receipts.remove(ids); ERP.ui.toast(ids.length + " deleted"); loadList(); loadCust(); } catch (e) { ERP.ui.toast(e.message, "err"); } };
["fFrom", "fTo"].forEach(i => $(i).onchange = () => loadList()); ["fMode", "fHead"].forEach(i => $(i).onchange = renderList); $("fQ").oninput = ERP.ui.debounce(() => { shown = 100; renderList(); }, 200);
$("more").onclick = () => { shown += 100; renderList(); };
$("btnPrint").onclick = () => { shown = 1e9; renderList(); window.print(); };

function openEdit(r) {
  editing = r; $("dSub").textContent = "Receipt " + r.voucher_no; fillModes($("eMode"), null); if (r.pay_mode && ![...$("eMode").options].some(o => o.value === r.pay_mode)) $("eMode").add(new Option(r.pay_mode, r.pay_mode));
  $("eDate").value = r.date; $("eRct").value = r.voucher_no || ""; $("eAcc").value = r.account_no || ""; $("eTitle").value = r.account_title || ""; $("eHead").value = r.account_head || "";
  $("eMode").value = r.pay_mode || ""; $("eAmt").value = r.amount; $("eRem").value = r.remarks || ""; $("eAccErr").textContent = ""; $("eDel").hidden = !ERP.auth.can("delete"); $("dlg").showModal();
}
$("eAcc").oninput = () => { const c = CUST.get($("eAcc").value.trim()); $("eAccErr").textContent = ""; if (c) $("eTitle").value = c.account_title; };
$("eSave").onclick = () => ERP.ui.busy($("eSave"), async () => {
  const f = { date: $("eDate").value, voucher_no: $("eRct").value.trim(), account_no: $("eAcc").value.trim(), account_title: $("eTitle").value.trim(), account_head: $("eHead").value.trim(), pay_mode: $("eMode").value, amount: +$("eAmt").value, remarks: $("eRem").value.trim() };
  if (!f.date || !f.voucher_no || !(f.amount > 0)) return ERP.ui.toast("Date, receipt no and amount are required", "err");
  if (!CUST.get(f.account_no)) { $("eAccErr").textContent = "Account not found"; return; }
  try { if (f.voucher_no !== editing.voucher_no && !isTag(f.voucher_no) && (await ERP.db.receipts.existing([f.voucher_no])).length) return ERP.ui.toast("That receipt no is already used", "err");
    await ERP.db.receipts.update(editing.id, f); ERP.ui.toast("Receipt updated"); $("dlg").close(); loadList(); loadCust(); } catch (e) { ERP.ui.toast(e.message, "err"); }
});
$("eDel").onclick = async () => { if (!confirm("Delete this receipt?")) return; try { await ERP.db.receipts.remove([editing.id]); ERP.ui.toast("Receipt deleted"); $("dlg").close(); loadList(); loadCust(); } catch (e) { ERP.ui.toast(e.message, "err"); } };

/* ---------- start ---------- */
$("tNew").onclick = () => { $("tNew").setAttribute("aria-selected", true); $("tList").setAttribute("aria-selected", false); $("pNew").hidden = false; $("pList").hidden = true; };
$("tList").onclick = () => { $("tList").setAttribute("aria-selected", true); $("tNew").setAttribute("aria-selected", false); $("pNew").hidden = true; $("pList").hidden = false; };
async function loadCust() { try { CUST = new Map((await ERP.db.customers.balances()).map(c => [String(c.account_no).trim(), c])); try { DUES = new Map((await ERP.db.saleDues()).map(d => [String(d.account_no).trim(), d])); } catch (e) { DUES = new Map(); } document.querySelectorAll("#rows .rrow").forEach(lookup); } catch (e) { ERP.ui.toast("Could not load customers: " + e.message, "err"); } }
(async () => {
  await ERP.auth.guard(); if (!ERP.auth.can("write")) { $("tNew").hidden = true; $("tList").click(); }
  fillModes($("rMode"), "Cash"); fillModes($("eMode"), null); resetEntry();
  const d = new Date(); $("fFrom").value = new Date(d.getFullYear(), d.getMonth(), 1, 12).toISOString().slice(0, 10);
  loadCust(); loadList();
})();
</script>
</body>
</html>
