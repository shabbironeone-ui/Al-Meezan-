<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconciliation</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .accs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
  .ac{flex:0 0 auto;min-width:170px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:var(--radius);padding:10px 14px;font:inherit;cursor:pointer;box-shadow:var(--shadow)}
  .ac small{color:var(--muted);font-weight:600;display:block}.ac b{font-size:17px;font-variant-numeric:tabular-nums}.ac[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
  .ac .bd{display:inline-block;margin-top:4px;font-size:11px;padding:1px 8px;border-radius:99px;background:#fee2e2;color:#991b1b;font-weight:600}.ac .bd.ok{background:#d1fae5;color:#065f46}
  .range{display:grid;gap:8px;grid-template-columns:1fr 1fr;padding:12px}
  @media(min-width:760px){.range{grid-template-columns:160px 160px 1fr}}
  .stats.four{grid-template-columns:1fr 1fr}@media(min-width:760px){.stats.four{grid-template-columns:repeat(4,1fr)}}
  .stat.bad b{color:var(--danger)}
  .cols{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:1000px){.cols{grid-template-columns:1fr 1fr}}
  .pane h3{margin:4px 0 8px;font-size:14px}
  .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:#fff;border:1px solid var(--line);border-left:5px solid #f59e0b;border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:14px}
  .it.m{border-left-color:#10b981}.it.clk{cursor:pointer}.it.clk:hover{border-color:var(--brand)}
  .it small{color:var(--muted)}.it .am{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.in{color:#047857}.out{color:var(--warn)}
  .it .st{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .seg{display:none;background:#e8edf3;border-radius:12px;padding:4px;margin-bottom:10px}.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}.seg button[aria-pressed="true"]{background:#fff;color:var(--brand-dark);box-shadow:var(--shadow)}
  @media(max-width:999px){.seg{display:flex}.pane[hidden-m]{display:none}}
  .cand{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;font:inherit;cursor:pointer}.cand:hover{border-color:var(--brand)}.cand.same{border-color:#10b981;background:#ecfdf5}
  .rw{display:grid;gap:6px;grid-template-columns:1fr 1fr;margin-bottom:10px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:10px}.rw .wide{grid-column:1/-1}
  @media(min-width:640px){.rw{grid-template-columns:150px 140px 150px 1fr auto}.rw .wide{grid-column:auto}}
</style>
</head>
<body>
<main class="page">
  <header class="appbar"><div><h1>Cash &amp; Bank Reconciliation</h1><p id="sub">Match your books with the bank statement</p></div>
    <div class="bar-actions"><button class="btn ghost" id="bAuto">⚡ Auto-match</button><button class="btn" id="bAdd">＋ Add statement entries</button></div></header>
  <div class="accs" id="accs"></div>
  <section class="card range"><div><label>From</label><input type="date" id="from"></div><div><label>To</label><input type="date" id="to"></div><div style="align-self:end;color:var(--muted);font-size:13px">Pick the period of the bank statement you are checking.</div></section>
  <section class="stats four" id="stats"></section>
  <div class="seg" id="seg"><button data-t="books" aria-pressed="true">Our books</button><button data-t="bank" aria-pressed="false">Bank statement</button></div>
  <div class="cols"><section class="pane" id="pBooks"><h3>In our books (Day Book)</h3><div id="books"></div></section><section class="pane" id="pBank"><h3>On the bank statement</h3><div id="bank"></div></section></div>
</main>

<dialog id="addDlg" class="sheet"><div class="sh-head"><div><h2>Add bank statement entries</h2><p id="addSub"></p></div><button class="x" data-close>✕</button></div>
  <div class="sh-body"><div id="addRows"></div><button class="btn soft" id="addRow" style="width:100%">＋ Add row</button><p style="font-size:12px;color:var(--muted)">Deposit = money came into the account. Withdrawal = money went out.</p></div>
  <div class="sh-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="addSave">Save entries</button></div></dialog>

<dialog id="mDlg" class="sheet"><div class="sh-head"><div><h2>Match this bank entry</h2><p id="mSub"></p></div><button class="x" data-close>✕</button></div>
  <div class="sh-body"><div id="mList"></div></div><div class="sh-foot"><button class="btn danger" id="mDel" hidden style="margin-right:auto">Delete entry</button><button class="btn ghost" data-close>Close</button></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script>
<script>
const $ = id => document.getElementById(id), E = ERP.ui.esc, M = ERP.ui.money, N = v => Number(v) || 0, PM = ERP_CONFIG.PAY_MODES, acctOf = e => e.account || "(none)";
let acct = PM.bank[0], EN = [], OPEN = new Map(), BANK = [], MATCH = new Set(), cur = null;
document.addEventListener("click", e => { const d = e.target.closest("dialog"); if (e.target.closest("[data-close]") && d) d.close(); });
const days = (a, b) => Math.abs((new Date(a + "T12:00") - new Date(b + "T12:00")) / 864e5);
const sg = e => N(e.money_in) - N(e.money_out), kk = e => e.src + ":" + e.rid;

async function load() {
  const from = $("from").value, to = $("to").value; if (!from || !to || from > to) return ERP.ui.toast("Check the dates", "err");
  $("books").innerHTML = $("bank").innerHTML = '<div class="skeleton"></div>';
  try {
    const [en, op, bk] = await Promise.all([ERP.db.accounts.entries({ from, to }), ERP.db.accounts.opening(from), ERP.db.bank.listAll()]);
    EN = en; OPEN = new Map(op.map(r => [r.account || "(none)", N(r.opening)])); BANK = bk; MATCH = new Set(bk.filter(b => b.match_src).map(b => b.match_src + ":" + b.match_rid)); render();
  } catch (e) { $("books").innerHTML = `<div class="empty">Could not load.<br><small>${E(e.message)}</small><br><small>Run sql/12_bank.sql if this mentions bank_statement.</small></div>`; $("bank").innerHTML = ""; }
}
const booksOf = a => EN.filter(e => acctOf(e) === a && (sg(e) !== 0 || e.needs_review));
const bankOf = a => BANK.filter(b => b.account === a && b.date >= $("from").value && b.date <= $("to").value);

function render() {
  const modes = [...new Set([...PM.bank, ...PM.cash, ...EN.map(acctOf), ...BANK.map(b => b.account)])];
  $("accs").innerHTML = modes.map(a => { const bs = booksOf(a), bn = bankOf(a), um = bs.filter(e => !MATCH.has(kk(e)) && sg(e) !== 0).length, ub = bn.filter(b => !b.match_src).length, close = (OPEN.get(a) || 0) + EN.filter(e => acctOf(e) === a).reduce((s, e) => s + sg(e), 0);
    return `<button class="ac" data-a="${E(a)}" aria-pressed="${a === acct}"><small>${E(a)}</small><b>Rs ${M(close)}</b><br>${bn.length || bs.length ? (um + ub ? `<span class="bd">${um + ub} unmatched</span>` : '<span class="bd ok">✓ matched</span>') : ""}</button>`; }).join("");
  const bs = booksOf(acct), bn = bankOf(acct), ub = bn.filter(b => !b.match_src), um = bs.filter(e => !MATCH.has(kk(e)) && sg(e) !== 0), sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  $("stats").innerHTML = `<div class="stat"><small>Books (net in period)</small><b>Rs ${M(sum(bs, sg))}</b></div><div class="stat"><small>Bank statement (net)</small><b>Rs ${M(sum(bn, b => N(b.amount)))}</b></div>
    <div class="stat ${um.length ? "bad" : ""}"><small>Not on statement (books)</small><b>${um.length} · Rs ${M(sum(um, sg))}</b></div><div class="stat ${ub.length ? "bad" : ""}"><small>Not in books (bank)</small><b>${ub.length} · Rs ${M(sum(ub, b => N(b.amount)))}</b></div>`;
  $("sub").textContent = `${acct} · ${$("from").value} to ${$("to").value}`;
  const amt = v => `<span class="${v >= 0 ? "in" : "out"}">${v >= 0 ? "+" : "−"}${M(Math.abs(v))}</span>`;
  $("books").innerHTML = bs.map(e => { const m = MATCH.has(kk(e)); return `<div class="it ${m ? "m" : ""}"><div><b>${E(e.party || e.head || e.kind)}</b><br><small>${E(e.date)} · ${E(e.kind)} ${E(e.voucher_no)}${e.remarks ? " · " + E(e.remarks) : ""}</small></div><div class="am">${amt(sg(e))}</div><div class="st"><span class="badge ${m ? "ok" : sg(e) ? "warn" : ""}">${m ? "✓ Matched" : e.needs_review ? "Check (old transfer)" : "Not on statement"}</span></div></div>`; }).join("") || '<div class="empty">No entries for this account in the period.</div>';
  $("bank").innerHTML = bn.sort((a, b) => a.date.localeCompare(b.date)).map(b => { const m = !!b.match_src; return `<div class="it clk ${m ? "m" : ""}" data-id="${b.id}"><div><b>${E(b.remarks || "(no description)")}</b><br><small>${E(b.date)}</small></div><div class="am">${amt(N(b.amount))}</div><div class="st"><span class="badge ${m ? "ok" : "warn"}">${m ? "✓ Matched" : "Not in books · tap to match"}</span></div></div>`; }).join("") || '<div class="empty">No bank statement entries yet. Use “Add statement entries”.</div>';
}
$("accs").onclick = e => { const b = e.target.closest(".ac"); if (b) { acct = b.dataset.a; render(); } };
$("from").onchange = $("to").onchange = load;
$("seg").onclick = e => { const b = e.target.closest("button"); if (!b) return; $("seg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  const bk = b.dataset.t === "bank"; $("pBooks").toggleAttribute("hidden-m", bk); $("pBank").toggleAttribute("hidden-m", !bk); };
$("pBank").setAttribute("hidden-m", "");

/* ---------- auto match: same amount, dates within 3 days, closest first ---------- */
$("bAuto").onclick = () => ERP.ui.busy($("bAuto"), async () => {
  const used = new Set(), pairs = [], free = booksOf(acct).filter(e => !MATCH.has(kk(e)) && sg(e) !== 0);
  bankOf(acct).filter(b => !b.match_src).sort((a, b) => a.date.localeCompare(b.date)).forEach(b => {
    const c = free.filter(e => !used.has(kk(e)) && Math.abs(sg(e) - N(b.amount)) < 0.005 && days(e.date, b.date) <= 3).sort((x, y) => days(x.date, b.date) - days(y.date, b.date))[0];
    if (c) { used.add(kk(c)); pairs.push([b.id, c.src, c.rid]); } });
  if (!pairs.length) return ERP.ui.toast("Nothing to match automatically", "err");
  try { await Promise.all(pairs.map(p => ERP.db.bank.setMatch(...p))); ERP.ui.toast(pairs.length + " entries matched"); load(); } catch (e) { ERP.ui.toast(e.message, "err"); } });

/* ---------- match one bank entry by hand ---------- */
$("bank").onclick = e => { const el = e.target.closest(".it[data-id]"); if (!el) return; const b = BANK.find(x => String(x.id) === el.dataset.id); cur = b; const edit = ERP.auth.can("edit");
  $("mSub").textContent = `${b.date} · ${b.amount >= 0 ? "+" : "−"}${M(Math.abs(b.amount))} · ${b.remarks || ""}`; $("mDel").hidden = !ERP.auth.can("delete");
  if (b.match_src) { const x = EN.find(en => en.src === b.match_src && String(en.rid) === String(b.match_rid));
    $("mList").innerHTML = `<p>Matched with: <b>${x ? E(x.party || x.head || x.kind) + " · " + E(x.date) + " · " + E(x.voucher_no) : E(b.match_src) + " #" + E(b.match_rid)}</b></p>${edit ? '<button class="btn danger" id="unm">Remove the match</button>' : ""}`;
    const u = $("unm"); if (u) u.onclick = async () => { try { await ERP.db.bank.setMatch(b.id, null, null); $("mDlg").close(); load(); } catch (er) { ERP.ui.toast(er.message, "err"); } };
  } else { const c = booksOf(acct).filter(x => !MATCH.has(kk(x)) && sg(x) !== 0).map(x => ({ x, same: Math.abs(sg(x) - N(b.amount)) < 0.005, d: days(x.date, b.date) })).sort((p, q) => q.same - p.same || p.d - q.d).slice(0, 15);
    $("mList").innerHTML = (c.length ? `<p style="font-size:13px;color:var(--muted)">Choose the entry from your books that this bank line belongs to. Same-amount entries are shown first.</p>` : '<div class="empty">No unmatched entry in your books for this period.</div>')
      + c.map(o => `<button class="cand ${o.same ? "same" : ""}" data-s="${E(o.x.src)}" data-r="${E(o.x.rid)}" ${edit ? "" : "disabled"}><span><b>${E(o.x.party || o.x.head || o.x.kind)}</b><br><small>${E(o.x.date)} · ${E(o.x.voucher_no)}</small></span><span class="${sg(o.x) >= 0 ? "in" : "out"}"><b>${sg(o.x) >= 0 ? "+" : "−"}${M(Math.abs(sg(o.x)))}</b>${o.same ? "<br><small>same amount ✓</small>" : ""}</span></button>`).join(""); }
  $("mDlg").showModal(); };
$("mList").onclick = async e => { const c = e.target.closest(".cand"); if (!c || !cur) return;
  try { await ERP.db.bank.setMatch(cur.id, c.dataset.s, c.dataset.r); $("mDlg").close(); ERP.ui.toast("Matched"); load(); } catch (er) { ERP.ui.toast(er.message, "err"); } };
$("mDel").onclick = async () => { if (!confirm("Delete this bank statement entry?")) return; try { await ERP.db.bank.remove([cur.id]); $("mDlg").close(); load(); } catch (e) { ERP.ui.toast(e.message, "err"); } };

/* ---------- add statement entries ---------- */
function addRow(v = {}) { const d = document.createElement("div"); d.className = "rw";
  d.innerHTML = `<input class="rd" type="date" value="${v.date || $("to").value}"><select class="rt"><option value="1">Deposit (in)</option><option value="-1">Withdrawal (out)</option></select><input class="ra" type="number" inputmode="decimal" min="0" placeholder="Amount"><input class="rr wide" placeholder="Description (as on the statement)"><button type="button" class="btn sm ghost x" style="color:var(--danger)" aria-label="Remove row">✕</button>`;
  $("addRows").appendChild(d); d.querySelector(".ra").focus(); }
$("bAdd").onclick = () => { $("addSub").textContent = acct; $("addRows").innerHTML = ""; addRow(); $("addDlg").showModal(); };
$("addRow").onclick = () => addRow({ date: [...$("addRows").querySelectorAll(".rd")].pop()?.value });
$("addRows").onclick = e => { const x = e.target.closest(".x"); if (x && $("addRows").children.length > 1) x.closest(".rw").remove(); };
$("addRows").onkeydown = e => { if (e.key === "Enter" && e.target.classList.contains("rr")) { e.preventDefault(); addRow({ date: e.target.closest(".rw").querySelector(".rd").value }); } };
$("addSave").onclick = () => ERP.ui.busy($("addSave"), async () => {
  const rows = []; let bad = false; $("addRows").querySelectorAll(".rw").forEach(r => { const a = +r.querySelector(".ra").value, d = r.querySelector(".rd").value; if (!a && !r.querySelector(".rr").value.trim()) return;
    if (!d || !(a > 0)) { bad = true; return; } rows.push({ account: acct, date: d, amount: a * +r.querySelector(".rt").value, remarks: r.querySelector(".rr").value.trim() }); });
  if (bad) return ERP.ui.toast("Every row needs a date and an amount", "err"); if (!rows.length) return ERP.ui.toast("Add at least one row", "err");
  try { await ERP.db.bank.add(rows); ERP.ui.toast(rows.length + " entries saved"); $("addDlg").close(); load(); } catch (e) { ERP.ui.toast(e.message, "err"); } });

(async () => { await ERP.auth.guard(); const t = new Date(); $("to").value = ERP.ui.today(); $("from").value = new Date(t.getFullYear(), t.getMonth(), 1, 12).toISOString().slice(0, 10);
  if (!ERP.auth.can("write")) $("bAdd").hidden = $("bAuto").hidden = true; load(); })();
</script>
</body>
</html>
