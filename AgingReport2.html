<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      margin: 8px auto;
      max-width: 1300px;
      padding: 5px;
      color: #333;
      transition: all 0.3s ease;
    }
    .container {
      max-width: 100%;
      margin: 0 auto;
      background: #fff;
      padding: 10px 15px;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      box-sizing: border-box;
      position: relative;
    }
    
    body.mobile-mode {
      margin: 2px !important;
      padding: 2px !important;
      overflow-x: hidden !important;
    }
    body.mobile-mode .container {
      max-width: 100% !important;
      padding: 6px !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    body.mobile-mode .filters-grid {
      grid-template-columns: 1fr 1fr !important;
      gap: 6px !important;
    }
    body.mobile-mode .input-group {
      grid-column: span 1 !important;
    }
    body.mobile-mode .input-group:nth-child(n+3) {

    }
    body.mobile-mode .button-group {
      grid-column: span 2 !important;

    }
    body.mobile-mode .button-group button {

    }
    body.mobile-mode .table-container {

    }
    body.mobile-mode th, body.mobile-mode td {

    body.mobile-mode h2 {

    .floating-mobile-toggle {
      position: absolute;

      background: #1b5e20;

      border: none;

    h2 {
      text-align: center;

    }
    .filters-grid {
      display: grid;

      align-items: end;

    }
    .input-group {
      display: flex;
      flex-direction: column;
    }
    .input-group label {
      font-size: 11px;
      font-weight: bold;
      color: #555;
      margin-bottom: 2px;
    }
    input[type="text"], input[type="date"], select {
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      width: 100%;
      box-sizing: border-box;
      height: 32px;
    }
    .button-group {
      display: flex;
      gap: 4px;
    }
    button {
      background-color: #1b5e20;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
      height: 32px;
      display: inline-flex;
      align-items: center;

    }
    button:hover {
      background-color: #144316;
    }
    button.secondary {
      background-color: #37474f;
    }
    button.secondary:hover {

    }
    button.excel-btn {
      background-color: #1f7246;
    }
    button.excel-btn:hover {
      background-color: #155734;
    }

    #loadingContainer {
      display: none;
      text-align: center;
      margin: 15px 0;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #1b5e20;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 5px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loadingMsg {
      color: #1b5e20;
      font-weight: bold;

    }

    .table-container {
      max-height: 460px;
      overflow-y: auto;
      overflow-x: auto;
      border: 1px solid #bbb;
      border-radius: 4px;
      margin-top: 4px;

      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      table-layout: fixed;
    }
    
    th, td {
      padding: 2px 4px;
      border: 1px solid #bbb !important;

    th {

    th.col-accNo, td.col-accNo { width: 55px; }         
    th.col-accTitle, td.col-accTitle { width: 120px; }   
    th.col-approvedBy, td.col-approvedBy { width: 55px; } 
    th.col-cro, td.col-cro { width: 32px; }

    th.col-monthlyInst, td.col-monthlyInst { width: 50px; } 
    th.col-remarks, td.col-remarks { width: 120px; }

    th.col-plan, td.col-plan { width: 32px; text-align: center; } 
    th.col-totalSales, td.col-totalSales { width: 60px; } 
    th.col-totalReceived, td.col-totalReceived { width: 60px; } 
    th.col-balance, td.col-balance { width: 55px; }      
    th.col-lpd, td.col-lpd { width: 60px; }                
    th.col-lpAmount, td.col-lpAmount { width: 55px; }    
    th.col-deliveryDate, td.col-deliveryDate { width: 60px; } 
    th.col-endingMonth, td.col-endingMonth { width: 60px; }

    th.col-m4, td.col-m4 { width: 45px; }                 
    th.col-m3, td.col-m3 { width: 45px; }                 
    th.col-m2, td.col-m2 { width: 52px; }                 
    th.col-m1, td.col-m1 { width: 52px; }                 

    .sticky-header {
      background-color: #1b5e20 !important;
      color: white !important;
      position: sticky;

      z-index: 3;

    }

    }
    .filter-header-row {

    }
    .filter-header-row th {
      padding: 1px 2px;
      background-color: #f1f8e9;
    }
    .filter-cell-wrapper {
      display: flex;
      align-items: center;
      gap: 1px;
    }
    .col-filter {
      width: 100%;
      padding: 1px 1px;
      font-size: 8px;
      border: 1px solid #c8e6c9;
      border-radius: 3px;
      box-sizing: border-box;
      height: 18px;
      background: #fff;
    }
    .excel-filter-btn {
      background: #e8f5e9;
      border: 1px solid #81c784;
      color: #1b5e20;
      cursor: pointer;
      font-size: 7px;
      padding: 0 1px;
      height: 18px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .excel-filter-btn.active-filter {
      background: #0288d1 !important;
      color: #fff !important;
      border-color: #01579b !important;
    }

    tbody tr:hover {
      background-color: #d1e7dd !important;
      font-weight: 500;
    }

    .account-link {
      color: #0d47a1;
      text-decoration: underline;
      cursor: pointer;
      font-weight: bold;
    }
    .account-link:hover {
      color: #1565c0;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .table-footer-row {
      background-color: #dcedc8 !important;
      font-weight: bold !important;
      color: #1b5e20 !important;
      position: sticky;
      bottom: 0;

    .table-footer-row td {
      border-top: 2px solid #1b5e20 !important;
      font-weight: bold !important;
      background-color: #dcedc8 !important;

      padding: 3px 2px !important;

  </style>
</head>
<body>

  <div class="container">
    <button class="floating-mobile-toggle" onclick="toggleMobileView()" id="mobileToggleBtn" title="Switch to Mobile View">
      <i class="fa fa-mobile-alt" id="toggleIcon"></i>
    </button>

    <h2>Al-Meezan Electronics - Customer Aging Report (Supabase)</h2>
    
    <div class="filters-grid">
      <div class="input-group">
        <label>START DATE</label>
        <input type="date" id="startDateInput">
      </div>
      <div class="input-group">
        <label>END DATE</label>
        <input type="date" id="endDateInput">
      </div>
      <div class="input-group">
        <label>ACCOUNT NO</label>
        <input type="text" id="searchAccInput" placeholder="Acc No..." inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="input-group">
        <label>ACCOUNT TITLE / NAME</label>
        <input type="text" id="searchTitleInput" placeholder="Name / Title..." inputmode="text">
      </div>
      <div class="input-group">
        <label>MOBILE NO</label>
        <input type="text" id="searchMobileInput" placeholder="Mobile No..." inputmode="tel" pattern="[0-9]*">
      </div>
      <div class="input-group">
        <label>START FROM ACCT</label>
        <input type="text" id="startFromAcctInput" placeholder="From Acc No..." inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="button-group">
        <button onclick="fetchAndFilterData(true)" title="Reload Data"><i class="fa fa-sync"></i></button>
        <button class="secondary" onclick="resetFilters()" title="Reset"><i class="fa fa-redo"></i></button>
        <button class="excel-btn" onclick="exportToExcel()" title="Export to Excel"><i class="fa fa-file-excel"></i></button>
        <button class="secondary" onclick="printReport()" title="Print"><i class="fa fa-print"></i></button>
      </div>
    </div>

    <div id="loadingContainer">
      <div class="spinner"></div>
      <div id="loadingMsg">Fetching aging records from Supabase... Please wait.</div>
    </div>

    <div class="table-container">
      <table id="reportTable">
        <thead>
          <tr class="sticky-header" id="mainHeaderRow">
            <th class="col-accNo">Acct Num</th>
            <th class="col-accTitle">Acct Title</th>
            <th class="col-approvedBy">Aprv by</th>
            <th class="col-cro">CRO</th>
            <th class="col-mobile">Mobile Nu</th>
            <th class="col-monthlyInst">M Inst</th>
            <th class="col-remarks">Remarks</th>
            <th class="col-cmd">CMD</th>
            <th class="col-plan">Plan</th>
            <th class="col-totalSales">Total Sale</th>
            <th class="col-totalReceived">Total Paid</th>
            <th class="col-balance">T Balance</th>
            <th class="col-lpd">LPD</th>
            <th class="col-lpAmount">L.Pamount</th>

          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="21" style="text-align: center; color: #777; padding: 15px;">Loading aging report from Supabase...</td>
          </tr>
        </tbody>
        <tfoot id="tableFooter"></tfoot>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ofplfqawiupcmqvzkhfp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8VV3n9Dr_XXgDnkuonMTqg_Hkfm59z_";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let globalResponse = null;

    function toggleMobileView() {
      document.body.classList.toggle('mobile-mode');
      const isMobile = document.body.classList.contains('mobile-mode');
      const icon = document.getElementById('toggleIcon');
      const btn = document.getElementById('mobileToggleBtn');
      if (isMobile) {
        icon.className = "fa fa-desktop";
        btn.title = 'Switch to Desktop View';
      } else {
        icon.className = "fa fa-mobile-alt";
        btn.title = 'Switch to Mobile View';
      }
    }

    function parseCustomDate(dateString) {
      if (!dateString) return null;
      if (dateString instanceof Date) return isNaN(dateString.getTime()) ? null : dateString;
      let str = String(dateString).trim();
      if (!str) return null;
      let isoMatch = str.match(/^(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
      if (isoMatch) {
        return new Date(parseInt(isoMatch[1], 10), parseInt(isoMatch[2], 10) - 1, parseInt(isoMatch[3], 10));
      }
      let d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    function formatDateDDMMYY(dateString) {
      let d = parseCustomDate(dateString);
      if (!d) return String(dateString || '');
      let day = String(d.getDate()).padStart(2, '0');
      let month = String(d.getMonth() + 1).padStart(2, '0');
      let year = String(d.getFullYear()).slice(-2);
      return `${day}-${month}-${year}`;
    }

    function formatMonthYearName(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) return '';
      let months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${months[dateObj.getMonth()]}-${String(dateObj.getFullYear()).slice(-2)}`;
    }

    async function fetchAndFilterData(forceReload = false) {
      if (globalResponse !== null && !forceReload) {
        applySearchFilter();
        return;
      }

      let loadingContainer = document.getElementById('loadingContainer');
      let loadingMsg = document.getElementById('loadingMsg');
      if (loadingContainer) loadingContainer.style.display = 'block';
      if (loadingMsg) loadingMsg.innerText = "Fetching aging records from Supabase... Please wait.";

      try {
        let [custRes, salesRes, receiptsRes] = await Promise.all([
          _supabase.from('customers').select('*'),
          _supabase.from('sales').select('*'),
          _supabase.from('receipts').select('*')
        ]);

        if (custRes.error) throw custRes.error;
        if (salesRes.error) throw salesRes.error;
        if (receiptsRes.error) throw receiptsRes.error;

        let customers = custRes.data || [];
        let sales = salesRes.data || [];
        let receipts = receiptsRes.data || [];

        // Map sales by account number (handling all possible column names)
        let salesMap = {};
        sales.forEach(s => {
          let acc = String(s.account_no || s.acc_no || s.accountNo || '').trim();
          if (!salesMap[acc]) salesMap[acc] = [];
          salesMap[acc].push(s);
        });

        // Map receipts by account number
        let receiptsMap = {};
        receipts.forEach(r => {
          let acc = String(r.account_no || r.acc_no || r.accountNo || '').trim();
          if (!receiptsMap[acc]) receiptsMap[acc] = [];
          receiptsMap[acc].push(r);
        });

        let agingRows = customers.map(cust => {
          let accNo = String(cust.account_no || cust.acc_no || cust.accountNo || '').trim();
          let custSales = salesMap[accNo] || [];
          let custReceipts = receiptsMap[accNo] || [];

          let primarySale = custSales[0] || {};
          
          // Total Sales calculation from sales table or customer table
          let totalSales = custSales.reduce((sum, s) => sum + (parseFloat(s.total_amt || s.total_amount || s.amount || s.totalSales) || 0), 0);
          if (totalSales === 0) {
            totalSales = parseFloat(cust.total_amt || cust.total_amount || cust.totalSales || 0);
          }

          let planMonths = parseInt(primarySale.plan_months || primarySale.plan || cust.plan_months || cust.plan || 12, 10);
          let monthlyInst = parseFloat(primarySale.installment_per_month || primarySale.monthlyInst || cust.installment_per_month || cust.monthlyInst || 0);
          
          if (monthlyInst === 0 && planMonths > 0 && totalSales > 0) {
            monthlyInst = Math.round(totalSales / planMonths);
          }

          let deliveryDate = primarySale.date || primarySale.delivery_date || cust.delivery_date || cust.date || '';
          let productDesc = [primarySale.company_name, primarySale.product_category, primarySale.model].filter(Boolean).join(' ') || cust.product || cust.model || '';

          let lpd = '';
          let lpAmount = 0;
          if (custReceipts.length > 0) {
            custReceipts.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            lpd = custReceipts[0].date || '';
            lpAmount = parseFloat(custReceipts[0].amount || custReceipts[0].credit || 0);
          }

          return {
            accNo: accNo,
            accTitle: cust.account_title || cust.name || cust.accTitle || '',
            approvedBy: cust.approved_by || cust.salesman || cust.approvedBy || '',
            cro: cust.cro || cust.sub_salesman || '',
            mobile: cust.mobile_number || cust.mobile || cust.phone || '',
            monthlyInst: monthlyInst,
            plan: planMonths,
            totalSales: totalSales,
            deliveryDate: deliveryDate,
            product: productDesc,
            lpd: lpd,
            lpAmount: lpAmount,
            ledger: custReceipts.map(r => ({
              date: r.date,
              credit: parseFloat(r.amount || r.credit || 0)
            }))
          };
        });

        globalResponse = { data: agingRows, monthHeaders: {} };
        if (loadingContainer) loadingContainer.style.display = 'none';
        applySearchFilter();

      } catch (err) {
        if (loadingContainer) loadingContainer.style.display = 'none';
        let tbody = document.getElementById('tableBody');
        if (tbody) tbody.innerHTML = `<tr><td colspan="21" style="text-align: center; color: #d32f2f; padding: 15px;">Supabase Error: ${err.message || err}</td></tr>`;
      }
    }

    function getPlanMonthsCount(row) {
      let num = parseInt(row.plan, 10);
      return isNaN(num) || num <= 0 ? 12 : num;
    }

    function calculateMonthlyInstallment(row) {
      return Number(row.monthlyInst) || 0;
    }

    function calculateEndingMonthObject(row) {
      let baseDate = parseCustomDate(row.deliveryDate);
      if (!baseDate || isNaN(baseDate.getTime())) return null;
      let planMonths = getPlanMonthsCount(row);
      let endDate = new Date(baseDate.getFullYear(), baseDate.getMonth(), 1);
      endDate.setMonth(endDate.getMonth() + (planMonths - 1));
      return endDate;
    }

    function calculateEndingMonth(row) {
      let endDate = calculateEndingMonthObject(row);
      return !endDate ? '' : formatMonthYearName(endDate);
    }

    function getBenchmarkDate() {
      let endDateVal = document.getElementById('endDateInput') ? document.getElementById('endDateInput').value : '';
      if (endDateVal) {
        let d = parseCustomDate(endDateVal);
        if (d && !isNaN(d.getTime())) {
          return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59);
        }
      }
      let now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    }

    function getDynamicMonthPayments(row) {
      let bench = getBenchmarkDate();
      let bYear = bench.getFullYear();
      let bMonth = bench.getMonth();

      let m1Start = new Date(bYear, bMonth, 1, 0, 0, 0);
      let m1End = bench;
      let m2Start = new Date(bYear, bMonth - 1, 1, 0, 0, 0);
      let m2End = new Date(bYear, bMonth, 0, 23, 59, 59);
      let m3Start = new Date(bYear, bMonth - 2, 1, 0, 0, 0);
      let m3End = new Date(bYear, bMonth - 1, 0, 23, 59, 59);
      let m4Start = new Date(bYear, bMonth - 3, 1, 0, 0, 0);
      let m4End = new Date(bYear, bMonth - 2, 0, 23, 59, 59);

      let ledger = row.ledger || [];
      let m1Amt = 0, m2Amt = 0, m3Amt = 0, m4Amt = 0;

      ledger.forEach(p => {
        let pDate = parseCustomDate(p.date);
        let pAmt = Number(p.credit) || 0;
        if (pDate && !isNaN(pDate.getTime())) {
          if (pDate >= m1Start && pDate <= m1End) m1Amt += pAmt;
          else if (pDate >= m2Start && pDate <= m2End) m2Amt += pAmt;
          else if (pDate >= m3Start && pDate <= m3End) m3Amt += pAmt;
          else if (pDate >= m4Start && pDate <= m4End) m4Amt += pAmt;
        }
      });

      return { m4: m4Amt, m3: m3Amt, m2: m2Amt, m1: m1Amt };
    }

    function calculateDynamicTotalPaid(row) {
      let ledger = row.ledger || [];
      let bench = getBenchmarkDate();
      let total = 0;
      ledger.forEach(p => {
        let pDate = parseCustomDate(p.date);
        let pAmt = Number(p.credit) || 0;
        if (pDate && !isNaN(pDate.getTime()) && pDate <= bench) {
          total += pAmt;
        }
      });
      return total;
    }

    function calculateDynamicBalance(row) {
      return Math.max(0, (Number(row.totalSales) || 0) - calculateDynamicTotalPaid(row));
    }

    function calculateCMD(row) {
      let tBal = calculateDynamicBalance(row);
      if (tBal <= 0) return 0;
      let inst = calculateMonthlyInstallment(row);
      if (inst <= 0) return tBal;

      let benchDate = getBenchmarkDate();
      let endDt = calculateEndingMonthObject(row);
      if (!endDt) return Math.min(inst, tBal);

      let remainingMonths = ((endDt.getFullYear() - benchDate.getFullYear()) * 12) + (endDt.getMonth() - benchDate.getMonth()) + 1;
      if (remainingMonths <= 1) return tBal;

      return tBal - (inst * (remainingMonths - 1));
    }

    function applySearchFilter() {
      if (!globalResponse || !globalResponse.data) return;
      let startDate = document.getElementById('startDateInput').value;
      let endDate = document.getElementById('endDateInput').value;
      let accQuery = document.getElementById('searchAccInput').value.toLowerCase().trim();
      let titleQuery = document.getElementById('searchTitleInput').value.toLowerCase().trim();
      let mobileQuery = document.getElementById('searchMobileInput').value.toLowerCase().trim();
      let startFromAcctQuery = document.getElementById('startFromAcctInput').value.toLowerCase().trim();

      let filtered = globalResponse.data.filter(row => {
        if (startDate || endDate) {
          let dDate = parseCustomDate(row.deliveryDate);
          if (!dDate) return false;
          if (startDate && dDate < parseCustomDate(startDate)) return false;
          if (endDate && dDate > parseCustomDate(endDate)) return false;
        }

        if (accQuery && !String(row.accNo || '').toLowerCase().includes(accQuery)) return false;
        if (titleQuery && !String(row.accTitle || '').toLowerCase().includes(titleQuery)) return false;
        if (mobileQuery && !String(row.mobile || '').toLowerCase().includes(mobileQuery)) return false;

        if (startFromAcctQuery) {
          if ((parseFloat(row.accNo) || 0) < (parseFloat(startFromAcctQuery) || 0)) return false;
        }
        return true;
      });

      renderTableRows(filtered);
    }

    function getDynamicMonthLabels() {
      let bench = getBenchmarkDate();
      return {
        m1: formatMonthYearName(new Date(bench.getFullYear(), bench.getMonth(), 1)),
        m2: formatMonthYearName(new Date(bench.getFullYear(), bench.getMonth() - 1, 1)),
        m3: formatMonthYearName(new Date(bench.getFullYear(), bench.getMonth() - 2, 1)),
        m4: formatMonthYearName(new Date(bench.getFullYear(), bench.getMonth() - 3, 1))
      };
    }

    let currentFilteredData = [];

    function renderTableRows(data) {
      let tbody = document.getElementById('tableBody');
      let tfoot = document.getElementById('tableFooter');
      let dynLabels = getDynamicMonthLabels();

      document.getElementById('thM4').innerText = dynLabels.m4;
      document.getElementById('thM3').innerText = dynLabels.m3;
      document.getElementById('thM2').innerText = dynLabels.m2;
      document.getElementById('thM1').innerText = dynLabels.m1;

      currentFilteredData = data;
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="21" style="text-align: center; color: #777; padding: 10px;">No records found.</td></tr>`;
        tfoot.innerHTML = ``;
        return;
      }

      let html = "";
      let sumInst = 0, sumSales = 0, sumPaid = 0, sumBal = 0, sumLpAmt = 0, sumM4 = 0, sumM3 = 0, sumM2 = 0, sumM1 = 0, sumCmd = 0;

      data.forEach(row => {
        let tBal = calculateDynamicBalance(row);
        let inst = calculateMonthlyInstallment(row);
        let planNum = getPlanMonthsCount(row);
        let approvedVal = row.approvedBy || '';
        let endVal = calculateEndingMonth(row);
        let prodVal = row.product || '';
        let lpdVal = formatDateDDMMYY(row.lpd);
        let lpAmt = Number(row.lpAmount) || 0;
        let mPmts = getDynamicMonthPayments(row);
        let totalSales = Number(row.totalSales) || 0;
        let totalPaid = calculateDynamicTotalPaid(row);
        let formattedDate = formatDateDDMMYY(row.deliveryDate);
        let cmd = calculateCMD(row);

        sumInst += inst; sumSales += totalSales; sumPaid += totalPaid; sumBal += tBal; sumLpAmt += lpAmt;
        sumM4 += mPmts.m4; sumM3 += mPmts.m3; sumM2 += mPmts.m2; sumM1 += mPmts.m1; sumCmd += cmd;

        html += `<tr>
          <td class="col-accNo"><span class="account-link" onclick="openLedgerNewTab('${row.accNo}')">${row.accNo || ''}</span></td>
          <td class="col-accTitle">${row.accTitle || ''}</td>
          <td class="col-approvedBy">${approvedVal}</td>
          <td class="col-cro">${row.cro || ''}</td>
          <td class="col-mobile">${row.mobile || ''}</td>
          <td class="col-monthlyInst" style="text-align: right;">${inst || ''}</td>
          <td class="col-remarks"></td>
          <td class="col-cmd" style="text-align: right;">${cmd || ''}</td>
          <td class="col-plan" style="text-align: center;">${planNum || ''}</td>
          <td class="col-totalSales" style="text-align: right;">${totalSales || ''}</td>
          <td class="col-totalReceived" style="text-align: right;">${totalPaid || ''}</td>
          <td class="col-balance" style="text-align: right; color: #b71c1c;">${tBal || ''}</td>
          <td class="col-lpd">${lpdVal}</td>
          <td class="col-lpAmount" style="text-align: right;">${lpAmt || ''}</td>
          <td class="col-deliveryDate">${formattedDate}</td>
          <td class="col-endingMonth">${endVal}</td>
          <td class="col-product">${prodVal}</td>
          <td class="col-m4" style="text-align: right;">${mPmts.m4 || ''}</td>
          <td class="col-m3" style="text-align: right;">${mPmts.m3 || ''}</td>
          <td class="col-m2" style="text-align: right;">${mPmts.m2 || ''}</td>
          <td class="col-m1" style="text-align: right;">${mPmts.m1 || ''}</td>
        </tr>`;
      });

      tbody.innerHTML = html;
      tfoot.innerHTML = `<tr class="table-footer-row">
        <td class="col-accNo" style="text-align:center;">Total</td>
        <td class="col-accTitle">(${data.length} Accts)</td>
        <td class="col-approvedBy"></td><td class="col-cro"></td><td class="col-mobile"></td>
        <td class="col-monthlyInst" style="text-align: right;">${sumInst}</td>
        <td class="col-remarks"></td>
        <td class="col-cmd" style="text-align: right;">${sumCmd}</td>
        <td class="col-plan"></td>
        <td class="col-totalSales" style="text-align: right;">${sumSales}</td>
        <td class="col-totalReceived" style="text-align: right;">${sumPaid}</td>
        <td class="col-balance" style="text-align: right;">${sumBal}</td>
        <td class="col-lpd"></td>
        <td class="col-lpAmount" style="text-align: right;">${sumLpAmt || ''}</td>
        <td class="col-deliveryDate"></td><td class="col-endingMonth"></td><td class="col-product"></td>
        <td class="col-m4" style="text-align: right;">${sumM4}</td>
        <td class="col-m3" style="text-align: right;">${sumM3}</td>
        <td class="col-m2" style="text-align: right;">${sumM2}</td>
        <td class="col-m1" style="text-align: right;">${sumM1}</td>
      </tr>`;
    }

    function exportToExcel() {
      if (!currentFilteredData.length) return alert("No data to export!");
      let dynLabels = getDynamicMonthLabels();
      let excelHTML = `<table><thead><tr><th>Acct Num</th><th>Acct Title</th><th>Aprv by</th><th>CRO</th><th>Mobile Nu</th><th>M Inst</th><th>Remarks</th><th>CMD</th><th>Plan</th><th>Total Sale</th><th>Total Paid</th><th>T Balance</th><th>LPD</th><th>L.Pamount</th><th>Deliv Date</th><th>End</th><th>Product</th><th>${dynLabels.m4}</th><th>${dynLabels.m3}</th><th>${dynLabels.m2}</th><th>${dynLabels.m1}</th></tr></thead><tbody>`;
      
      currentFilteredData.forEach(row => {
        let mPmts = getDynamicMonthPayments(row);
        excelHTML += `<tr><td>${row.accNo || ''}</td><td>${row.accTitle || ''}</td><td>${row.approvedBy || ''}</td><td>${row.cro || ''}</td><td>${row.mobile || ''}</td><td>${calculateMonthlyInstallment(row)}</td><td></td><td>${calculateCMD(row)}</td><td>${getPlanMonthsCount(row)}</td><td>${row.totalSales || 0}</td><td>${calculateDynamicTotalPaid(row)}</td><td>${calculateDynamicBalance(row)}</td><td>${formatDateDDMMYY(row.lpd)}</td><td>${row.lpAmount || ''}</td><td>${formatDateDDMMYY(row.deliveryDate)}</td><td>${calculateEndingMonth(row)}</td><td>${row.product || ''}</td><td>${mPmts.m4}</td><td>${mPmts.m3}</td><td>${mPmts.m2}</td><td>${mPmts.m1}</td></tr>`;
      });
      excelHTML += `</tbody></table>`;

      let blob = new Blob([excelHTML], { type: 'application/vnd.ms-excel' });
      let a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Customer_Aging_Report.xls';
      a.click();
    }

    function openLedgerNewTab(accNo) {
      if (!accNo) return alert('Account number is missing!');
      window.open(`CustomerLedgerView.html?accNo=${encodeURIComponent(accNo)}`, '_blank');
    }

    function resetFilters() {
      ['startDateInput', 'endDateInput', 'searchAccInput', 'searchTitleInput', 'searchMobileInput', 'startFromAcctInput'].forEach(id => document.getElementById(id).value = '');
      if (globalResponse && globalResponse.data) renderTableRows(globalResponse.data);
    }

    function printReport() {
      setTimeout(() => window.print(), 300);
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchAndFilterData();
      ['startDateInput', 'endDateInput'].forEach(id => document.getElementById(id).addEventListener('change', applySearchFilter));
      ['searchAccInput', 'searchTitleInput', 'searchMobileInput', 'startFromAcctInput'].forEach(id => document.getElementById(id).addEventListener('input', applySearchFilter));
    });
  </script>
</body>
</html>
