<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchases</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .tabs{display:inline-flex;background:#e8edf3;border-radius:12px;padding:4px;margin-bottom:12px}
  .tabs button{min-height:40px;padding:6px 18px;border:0;border-radius:9px;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--brand-dark);box-shadow:var(--shadow)}
  .line{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .l-top{display:grid;grid-template-columns:140px 1fr auto auto;gap:8px;align-items:center;margin-bottom:10px}
  .pinfo{min-width:0;font-size:14px}.pinfo small{display:block;color:var(--muted)}.pinfo.none{color:var(--muted)}
  .l-grid{display:grid;gap:8px;grid-template-columns:1fr 1fr}
  .l-grid .wide{grid-column:1/-1}
  @media(min-width:760px){.l-grid{grid-template-columns:90px 120px 130px 120px 80px 1fr 1fr}.l-grid .wide{grid-column:auto}}
  @media(max-width:520px){.l-top{grid-template-columns:1fr auto auto}.l-top .pid{grid-column:1/-1}}
  .l-grid label{font-size:11px}
  .sumbar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));margin:0 -12px;box-shadow:0 -6px 18px rgba(15,23,42,.08);z-index:5}
  .sumbar b{font-size:20px;font-variant-numeric:tabular-nums}.sumbar small{color:var(--muted);display:block}
  .editing{background:#fef3c7;border:1px solid #f59e0b;color:#78350f;border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .po{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow)}
  .po-h{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;cursor:pointer}
  .po-h b{font-size:15px}.po-h small{color:var(--muted)}.po-h .amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .po-b{padding:0 14px 12px}.po-b .table-wrap{margin-bottom:10px}
  .plist{max-height:50vh;overflow:auto}
  .pi{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;font:inherit;cursor:pointer}
  .pi:hover{border-color:var(--brand)}.pi small{color:var(--muted);display:block}
  datalist{display:none}
</style>
</head>
<body>
<main class="page">
  <header class="appbar"><div><h1>Purchases</h1><p>Stock in from suppliers</p></div></header>
  <div class="tabs" role="tablist"><button role="tab" id="tNew" aria-selected="true">New purchase</button><button role="tab" id="tHist" aria-selected="false">History</button></div>

  <!-- NEW / EDIT -->
  <section id="pNew">
    <div class="editing" id="editBar" hidden><span id="editTxt"></span><button class="btn sm ghost" id="cancelEdit">Cancel edit</button></div>
    <div class="card"><div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div><label for="pDate">Purchase date</label><input id="pDate" type="date"></div>
      <div><label for="pVendor">Supplier</label><select id="pVendor"></select></div>
      <div><label for="pWh">Warehouse</label><input id="pWh" value="MAIN WAREHOUSE"></div></div></div>
    <div id="lines"></div>
    <button class="btn soft" id="addLine" style="width:100%;margin-bottom:12px">＋ Add item</button>
    <div class="sumbar"><div><small id="sCount">0 items · 0 pcs</small><b id="sTotal">Rs 0</b></div><button class="btn" id="btnSave">Save purchase</button></div>
  </section>

  <!-- HISTORY -->
  <section id="pHist" hidden>
    <div class="card" style="display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:end">
      <div><label>From</label><input type="date" id="hFrom"></div><div><label>To</label><input type="date" id="hTo"></div>
      <div><label>Supplier</label><select id="hVendor"></select></div><div><label>Search</label><input id="hQ" type="search" placeholder="PO, model, serial"></div></div>
    <p id="hSum" style="color:var(--muted);font-size:13px;margin:0 0 8px"></p>
    <div id="hList"></div>
  </section>
</main>

<dialog id="pick" class="sheet"><div class="sh-head"><div><h2>Select product</h2></div><button class="x" data-close>✕</button></div>
  <div class="sh-body"><input id="pickQ" type="search" placeholder="Search brand, model, color or ID" style="margin-bottom:10px"><div class="plist" id="pickList"></div></div>
  <div class="sh-foot"><button class="btn ghost" id="openQuick">＋ New product</button><button class="btn ghost" data-close>Close</button></div></dialog>

<dialog id="quick" class="sheet"><div class="sh-head"><div><h2>New product</h2><p>Added to your product list</p></div><button class="x" data-close>✕</button></div>
  <div class="sh-body"><div class="fsec"><div class="fgrid">
    <div><label>Category *</label><input id="qCat" list="dCat" autocomplete="off" placeholder="e.g. MOBILE"></div>
    <div><label>Brand *</label><input id="qBrand" list="dBrand" autocomplete="off" placeholder="e.g. SAMSUNG"></div>
    <div><label>Model *</label><input id="qModel" autocomplete="off"></div><div><label>Color</label><input id="qColor" autocomplete="off"></div>
    <div class="mob"><label>RAM (GB)</label><input id="qRam" inputmode="numeric"></div><div class="mob"><label>Storage (GB)</label><input id="qMem" inputmode="numeric"></div>
    <div class="wide"><label>Remarks</label><input id="qRem" autocomplete="off"></div></div><small class="err" id="qErr"></small></div></div>
  <div class="sh-foot"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="qSave">Save product</button></div>
  <datalist id="dCat"></datalist><datalist id="dBrand"></datalist></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script>
<script>
const $ = id => document.getElementById(id), E = ERP.ui.esc, M = ERP.ui.money, up = s => String(s || "").trim().toUpperCase();
let PRODUCTS = [], editingPO = null, activeLine = null, HIST = [];
const spec = v => String(v || "").replace(/gb|mb/gi, "").trim();
function label(p) { let m = up(p.model); const r = spec(p.ram), s = spec(p.memory);
  if ((r || s) && !m.includes(r || "~") && !m.includes(s || "~")) m += " " + (r && s ? r + "/" + s : r || s); return m; }
const byId = id => PRODUCTS.find(p => String(p.product_id).toLowerCase() === String(id).trim().toLowerCase());
document.addEventListener("click", e => { const d = e.target.closest("dialog"); if (e.target.closest("[data-close]") && d) d.close(); });

/* ---------- lines ---------- */
function addLine(v = {}) {
  const d = document.createElement("div"); d.className = "line";
  d.innerHTML = `<div class="l-top"><input class="pid" placeholder="Product ID" autocomplete="off"><div class="pinfo none">No product selected</div>
    <button type="button" class="btn sm ghost browse">Browse</button><button type="button" class="btn sm ghost del" aria-label="Remove item" style="color:var(--danger)">✕</button></div>
    <div class="l-grid"><div><label>Qty</label><input class="qty" type="number" inputmode="decimal" min="0" value="${v.qty || 1}"></div>
      <div><label>Cost price</label><input class="cost" type="number" inputmode="decimal" min="0" value="${v.cost_price || ""}"></div>
      <div><label>Line total</label><input class="tot" type="number" inputmode="decimal" min="0" value="${v.line_total || ""}"></div>
      <div><label>MRP</label><input class="mrp" type="number" inputmode="decimal" min="0" value="${v.mrp || ""}"></div>
      <div><label>HP %</label><input class="hp" type="number" inputmode="decimal" min="0" value="${v.hp_percent || ""}"></div>
      <div class="wide"><label>Serial / IMEI</label><input class="serial" value="${E(v.serial_no)}" autocomplete="off"></div>
      <div class="wide"><label>Remarks</label><input class="rem" value="${E(v.remarks)}" autocomplete="off"></div></div>`;
  $("lines").appendChild(d);
  if (v.product_id) setProduct(d, byId(v.product_id) || { product_id: v.product_id, company_name: v.company_name, product_category: v.product_category, model: v.model, color: v.color }, true);
  return d;
}
function setProduct(line, p, keepPrices) {
  line._p = p; line.querySelector(".pid").value = p.product_id;
  const i = line.querySelector(".pinfo"); i.classList.remove("none");
  i.innerHTML = `<b>${E(label(p))}</b><small>${E(up(p.company_name))} · ${E(up(p.product_category))}${p.color ? " · " + E(up(p.color)) : ""}</small>`;
  if (!keepPrices) { const c = line.querySelector(".cost"), m = line.querySelector(".mrp");
    if (!c.value && Number(p.cost_price)) c.value = p.cost_price; if (!m.value && Number(p.mrp)) m.value = p.mrp; calc(line, "cost"); }
  totals();
}
function calc(line, from) {
  const q = +line.querySelector(".qty").value || 0, c = line.querySelector(".cost"), t = line.querySelector(".tot");
  if (from === "tot") { if (q > 0) c.value = +(+t.value / q).toFixed(2); } else t.value = +(q * (+c.value || 0)).toFixed(2);
  totals();
}
function totals() {
  let n = 0, q = 0, t = 0;
  document.querySelectorAll("#lines .line").forEach(l => { n++; q += +l.querySelector(".qty").value || 0; t += +l.querySelector(".tot").value || 0; });
  $("sCount").textContent = `${n} item${n === 1 ? "" : "s"} · ${M(q)} pcs`; $("sTotal").textContent = "Rs " + M(t);
}
$("lines").addEventListener("input", e => { const l = e.target.closest(".line"); if (!l) return;
  if (e.target.matches(".qty,.cost")) calc(l, "cost"); else if (e.target.matches(".tot")) calc(l, "tot"); });
$("lines").addEventListener("change", e => { if (e.target.matches(".pid")) { const l = e.target.closest(".line"), p = byId(e.target.value);
  if (p) setProduct(l, p); else if (e.target.value.trim()) { ERP.ui.toast("Product ID not found", "err"); e.target.value = ""; } } });
$("lines").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".pid")) { e.preventDefault(); e.target.dispatchEvent(new Event("change", { bubbles: true })); } });
$("lines").addEventListener("click", e => { const l = e.target.closest(".line"); if (!l) return;
  if (e.target.closest(".browse")) { activeLine = l; $("pickQ").value = ""; renderPick(); $("pick").showModal(); }
  if (e.target.closest(".del")) { if (document.querySelectorAll("#lines .line").length > 1) { l.remove(); totals(); } else ERP.ui.toast("At least one item is needed", "err"); } });
$("addLine").onclick = () => { const l = addLine(); l.querySelector(".pid").focus(); };

/* ---------- product picker + quick add ---------- */
function renderPick() {
  const q = $("pickQ").value.trim().toLowerCase();
  const rows = PRODUCTS.filter(p => !q || [p.product_id, p.company_name, p.model, p.color, p.product_category, p.ram, p.memory].join(" ").toLowerCase().includes(q)).slice(0, 80);
  $("pickList").innerHTML = rows.map(p => `<button type="button" class="pi" data-id="${E(p.product_id)}"><b>${E(label(p))}</b> ${p.color ? "· " + E(up(p.color)) : ""}<small>${E(up(p.company_name))} · ${E(up(p.product_category))} · ${E(p.product_id)}</small></button>`).join("")
    || '<div class="empty">No product found. Use “New product”.</div>';
}
$("pickQ").oninput = ERP.ui.debounce(renderPick, 150);
$("pickList").onclick = e => { const b = e.target.closest(".pi"); if (b && activeLine) { setProduct(activeLine, byId(b.dataset.id)); $("pick").close(); } };
const isMob = () => /MOBILE|PHONE/.test(up($("qCat").value));
const syncMob = () => document.querySelectorAll("#quick .mob").forEach(x => x.style.display = isMob() ? "" : "none");
$("qCat").oninput = syncMob;
$("openQuick").onclick = () => { ["qCat","qBrand","qModel","qColor","qRam","qMem","qRem"].forEach(i => $(i).value = ""); $("qErr").textContent = ""; syncMob(); $("pick").close(); $("quick").showModal(); };
$("qSave").onclick = () => ERP.ui.busy($("qSave"), async () => {
  const p = { product_id: ERP.db.products.newId(), product_category: up($("qCat").value), company_name: up($("qBrand").value), model: up($("qModel").value), color: up($("qColor").value),
    ram: isMob() ? up($("qRam").value) : "", memory: isMob() ? up($("qMem").value) : "", remarks: up($("qRem").value) };
  if (!p.product_category || !p.company_name || !p.model) { $("qErr").textContent = "Category, brand and model are required"; return; }
  const dup = PRODUCTS.find(x => up(x.company_name) === p.company_name && up(x.model) === p.model && up(x.color) === p.color && up(x.ram) === p.ram && up(x.memory) === p.memory);
  if (dup && !confirm("This product already exists (" + dup.product_id + "). Add a duplicate anyway?")) return;
  try { await ERP.db.products.save(p); PRODUCTS.push(p); fillLists(); $("quick").close(); if (activeLine) setProduct(activeLine, p); ERP.ui.toast("Product added: " + p.product_id); }
  catch (e) { $("qErr").textContent = e.message; }
});
function fillLists() {
  const u = k => [...new Set(PRODUCTS.map(p => up(p[k])).filter(Boolean))].sort().map(v => `<option value="${E(v)}">`).join("");
  $("dCat").innerHTML = u("product_category"); $("dBrand").innerHTML = u("company_name");
}

/* ---------- save ---------- */
function resetForm() {
  editingPO = null; $("editBar").hidden = true; $("lines").innerHTML = ""; addLine(); $("pDate").value = ERP.ui.today(); $("pWh").value = "MAIN WAREHOUSE"; totals();
}
$("btnSave").onclick = () => ERP.ui.busy($("btnSave"), async () => {
  const head = { purchase_date: $("pDate").value, supplier: $("pVendor").value, warehouse: $("pWh").value.trim() || "MAIN WAREHOUSE" };
  if (!head.purchase_date) return ERP.ui.toast("Select the purchase date", "err");
  if (!head.supplier) return ERP.ui.toast("Select the supplier", "err");
  const items = []; let bad = null;
  document.querySelectorAll("#lines .line").forEach((l, i) => { if (bad) return; const p = l._p, v = c => +l.querySelector(c).value || 0;
    if (!p) bad = [l, `Item ${i + 1}: select a product`]; else if (v(".qty") <= 0) bad = [l, `Item ${i + 1}: quantity must be more than 0`];
    else if (v(".cost") <= 0 && !confirm(`Item ${i + 1} has cost 0. Save anyway?`)) bad = [l, "Enter the cost price"];
    else items.push({ product_id: p.product_id, company_name: up(p.company_name), product_category: up(p.product_category), model: label(p), color: up(p.color),
      qty: v(".qty"), cost_price: v(".cost"), mrp: v(".mrp"), hp_percent: v(".hp"), hp_amount: v(".qty") * v(".cost") * v(".hp") / 100,
      line_total: v(".tot") || v(".qty") * v(".cost"), serial_no: l.querySelector(".serial").value.trim(), remarks: l.querySelector(".rem").value.trim() }); });
  if (bad) { bad[0].scrollIntoView({ block: "center" }); return ERP.ui.toast(bad[1], "err"); }
  if (editingPO) head.po_num = editingPO;
  try { const r = await ERP.db.purchases.save(head, items, !!editingPO); ERP.ui.toast((editingPO ? "Purchase updated: " : "Purchase saved: ") + r.po_num); resetForm(); loadHist(); }
  catch (e) { ERP.ui.toast(e.message, "err"); }
});
$("cancelEdit").onclick = resetForm;

/* ---------- history ---------- */
async function loadHist() {
  $("hList").innerHTML = '<div class="card"><div class="skeleton" style="width:60%"></div></div>';
  try { HIST = await ERP.db.purchases.recent({ from: $("hFrom").value, to: $("hTo").value, supplier: $("hVendor").value }); renderHist(); }
  catch (e) { $("hList").innerHTML = `<div class="empty">${E(e.message)}</div>`; }
}
function renderHist() {
  const q = $("hQ").value.trim().toLowerCase(), g = new Map();
  HIST.filter(r => !q || [r.po_num, r.model, r.serial_no, r.supplier, r.company_name].join(" ").toLowerCase().includes(q)).forEach(r => { const k = r.po_num || "—"; (g.get(k) || g.set(k, []).get(k)).push(r); });
  let grand = 0;
  $("hList").innerHTML = [...g].map(([po, rs]) => { const tot = rs.reduce((s, r) => s + (+r.line_total || 0), 0), qty = rs.reduce((s, r) => s + (+r.qty || 0), 0); grand += tot;
    return `<article class="po" data-po="${E(po)}"><div class="po-h"><div><b>${E(po)}</b><br><small>${E(rs[0].purchase_date)} · ${E(rs[0].supplier)}</small></div><div class="amt">Rs ${M(tot)}<br><small style="font-weight:400;color:var(--muted)">${rs.length} items · ${M(qty)} pcs</small></div></div>
      <div class="po-b" hidden><div class="table-wrap"><table style="min-width:520px"><thead><tr><th>Product</th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Total</th><th>Serial</th></tr></thead><tbody>${rs.map(r => `<tr><td>${E(r.model)} <small style="color:var(--muted)">${E(r.company_name)} ${E(r.color)}</small></td><td class="num">${M(r.qty)}</td><td class="num">${M(r.cost_price)}</td><td class="num">${M(r.line_total)}</td><td>${E(r.serial_no)}</td></tr>`).join("")}</tbody></table></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">${ERP.auth.can("delete") ? '<button class="btn sm danger" data-do="del">Delete</button>' : ""}${ERP.auth.can("edit") ? '<button class="btn sm" data-do="edit">Edit</button>' : ""}</div></div></article>`; }).join("")
    || '<div class="empty">No purchases in this period.</div>';
  $("hSum").textContent = `${g.size} purchase${g.size === 1 ? "" : "s"} · Rs ${M(grand)}${HIST.length >= 1500 ? " (showing latest 1500 lines, narrow the dates)" : ""}`;
}
$("hList").onclick = async e => {
  const art = e.target.closest(".po"); if (!art) return; const po = art.dataset.po, act = e.target.closest("[data-do]");
  if (!act) { const b = art.querySelector(".po-b"); b.hidden = !b.hidden; return; }
  if (act.dataset.do === "edit") {
    const rows = HIST.filter(r => r.po_num === po); editingPO = po; $("tNew").click(); $("lines").innerHTML = "";
    $("pDate").value = rows[0].purchase_date; $("pVendor").value = rows[0].supplier; rows.forEach(r => addLine(r)); totals();
    $("editBar").hidden = false; $("editTxt").textContent = "Editing " + po + " (saving replaces the whole purchase and its stock entry)"; window.scrollTo(0, 0);
  } else if (confirm(`Delete purchase ${po}? Its stock-in entries will be removed too.`)) {
    try { await ERP.db.purchases.remove(po); ERP.ui.toast("Purchase deleted"); loadHist(); } catch (er) { ERP.ui.toast(er.message, "err"); }
  }
};
["hFrom", "hTo", "hVendor"].forEach(i => $(i).onchange = loadHist); $("hQ").oninput = ERP.ui.debounce(renderHist, 200);

/* ---------- tabs + start ---------- */
$("tNew").onclick = () => { $("tNew").setAttribute("aria-selected", true); $("tHist").setAttribute("aria-selected", false); $("pNew").hidden = false; $("pHist").hidden = true; };
$("tHist").onclick = () => { $("tHist").setAttribute("aria-selected", true); $("tNew").setAttribute("aria-selected", false); $("pNew").hidden = true; $("pHist").hidden = false; };
(async () => {
  await ERP.auth.guard(); if (!ERP.auth.can("write")) { $("tNew").hidden = true; $("tHist").click(); }
  const d = new Date(Date.now() - 60 * 864e5); $("hFrom").value = d.toISOString().slice(0, 10);
  resetForm();
  try {
    const [pr, s] = await Promise.all([ERP.db.products.list(), ERP.db.settings()]);
    PRODUCTS = pr; fillLists();
    const v = s.rows.filter(r => String(r.category).trim().toUpperCase() === "VENDOR").map(r => String(r.display_name).trim()).filter(Boolean);
    $("pVendor").innerHTML = '<option value="">Select supplier...</option>' + v.map(x => `<option>${E(x)}</option>`).join("");
    $("hVendor").innerHTML = '<option value="">All suppliers</option>' + v.map(x => `<option>${E(x)}</option>`).join("");
  } catch (e) { ERP.ui.toast("Could not load products/suppliers: " + e.message, "err"); }
  loadHist();
})();
</script>
</body>
</html>
