<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .kpis{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .kpi{border-left:5px solid var(--brand);margin:0}.kpi small{color:var(--muted);font-weight:600}
  .kpi b{display:block;font-size:clamp(18px,4.5vw,26px);font-variant-numeric:tabular-nums}
  .kpi.warn{border-color:var(--warn)}.kpi.bad{border-color:var(--danger)}.kpi.info{border-color:#3b82f6}
  .chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .pair{display:flex;align-items:flex-end;gap:3px;height:calc(100% - 22px);width:100%;justify-content:center}
  .bar{width:38%;max-width:30px;border-radius:4px 4px 0 0;min-height:2px}
  .bar.s{background:#3b82f6}.bar.c{background:var(--brand)}
  .col span{font-size:11px;color:var(--muted);margin-top:4px}
  .legend{font-size:12px;color:var(--muted);display:flex;gap:14px;margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
</style>
</head>
<body>
<main class="page">
  <div class="top"><h2 style="margin:0">Dashboard</h2><span><small id="stamp" style="color:var(--muted)"></small> <button class="btn ghost" id="reload">Refresh</button></span></div>
  <div id="skel" class="card"><div class="skeleton" style="width:60%"></div><br><div class="skeleton"></div><br><div class="skeleton" style="width:80%"></div></div>
  <div id="content" hidden>
    <div class="kpis">
      <div class="card kpi info"><small>Total Sales</small><b id="k1"></b></div>
      <div class="card kpi"><small>Total Collections</small><b id="k2"></b></div>
      <div class="card kpi warn"><small>Outstanding</small><b id="k3"></b></div>
      <div class="card kpi bad"><small>Net Cash Flow (estimate)</small><b id="k4"></b></div>
    </div>
    <div class="card" style="margin-top:12px"><h3>Last 6 months</h3><div class="chart" id="chart"></div>
      <div class="legend"><span><i style="background:#3b82f6"></i>Sales</span><span><i style="background:var(--brand)"></i>Collections</span></div></div>
    <div class="card"><h3>Breakdown</h3><div class="table-wrap"><table style="min-width:0"><tbody id="rows"></tbody></table></div>
      <p style="font-size:12px;color:var(--muted);margin:8px 0 0">Net Cash Flow = advance + receipts + general receipts − expenses − payments (contra transfers ignored).</p></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script>
<script>
const $ = id => document.getElementById(id), rs = n => "Rs " + ERP.ui.money(n), N = Number;
async function load() {
  $("skel").hidden = false; $("content").hidden = true;
  try {
    const [k, mo] = await Promise.all([ERP.db.kpis(), ERP.db.monthly(6)]);
    const coll = N(k.cash_collections) + N(k.bank_collections);
    $("k1").textContent = rs(k.sales_volume); $("k2").textContent = rs(coll + N(k.advance_total));
    $("k3").textContent = rs(k.outstanding);
    $("k4").textContent = rs(N(k.advance_total) + coll + N(k.general_receipts_total) - N(k.expenses_total) - N(k.payments_total));
    const rows = [["Customers", ERP.ui.money(k.customers)], ["Sales contracts", ERP.ui.money(k.sales_rows)],
      ["Cash collections", rs(k.cash_collections)], ["Bank / cheque collections", rs(k.bank_collections)],
      ["Advance total", rs(k.advance_total)], ["Processing fee total", rs(k.processing_fee_total)],
      ["Expenses", rs(k.expenses_total)], ["Payments", rs(k.payments_total)], ["Receipt entries", ERP.ui.money(k.receipt_count)]];
    $("rows").innerHTML = rows.map(r => `<tr><td>${ERP.ui.esc(r[0])}</td><td class="num"><b>${ERP.ui.esc(r[1])}</b></td></tr>`).join("");
    const m = mo.slice().reverse(), max = Math.max(1, ...m.map(x => Math.max(N(x.sales), N(x.collections))));
    $("chart").innerHTML = m.map(x => `<div class="col"><div class="pair">
      <div class="bar s" style="height:${N(x.sales) / max * 100}%" title="Sales ${rs(x.sales)}"></div>
      <div class="bar c" style="height:${N(x.collections) / max * 100}%" title="Collections ${rs(x.collections)}"></div></div>
      <span>${new Date(x.m).toLocaleString("en", { month: "short" })}</span></div>`).join("") || "<p>No data yet</p>";
    $("stamp").textContent = "Updated " + new Date().toLocaleTimeString();
    $("content").hidden = false;
  } catch (e) { ERP.ui.toast("Could not load: " + e.message, "err"); }
  $("skel").hidden = true;
}
$("reload").onclick = () => ERP.ui.busy($("reload"), load);
ERP.auth.guard().then(load);
</script>
</body>
</html>
