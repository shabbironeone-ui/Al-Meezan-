<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Ledger</title>
<style>
:root{--brand:#1d4ed8;--soft:#eaf1ff;--line:#e3e8ef;--muted:#64748b;--ink:#0f172a;--bg:#f4f6fa;--in:#047857;--out:#b91c1c;--r:14px;--sh:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.page{max-width:1500px;margin:0 auto;padding:0 14px 40px}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(244,246,250,.93);backdrop-filter:blur(8px);padding:14px 0 12px}
.top h1{margin:0;font-size:20px}.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:10px;padding:8px 13px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--brand);border-color:#c7d6f5}.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:#fff;color:#dc2626;border-color:#fecaca}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-bottom:12px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);border-top:3px solid var(--brand)}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600}.kpi b{font-size:21px;font-variant-numeric:tabular-nums}
.kpi.i{border-top-color:#10b981}.kpi.i b{color:var(--in)}.kpi.o{border-top-color:#ef4444}.kpi.o b{color:var(--out)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;margin-bottom:10px}
.bar input,.bar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.bar input:focus,.bar select:focus{outline:2px solid var(--brand);outline-offset:1px}
.sq{position:relative;flex:1;min-width:230px}.sq input{width:100%;padding-right:34px}
.mic{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;font-size:15px;opacity:.6}.mic.on{opacity:1;background:#fee2e2;border-radius:50%}
.seg{display:flex;background:#e2e8f0;border-radius:10px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}
.ck{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips:empty{display:none}
.chip{background:var(--soft);color:#1e3a8a;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.tw{overflow:auto;max-height:calc(100vh - 330px);min-height:240px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{position:sticky;top:0;background:#f8fafc;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:#475569;cursor:pointer;user-select:none;z-index:2}
thead th:hover{color:var(--brand)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:#f8fafc}
.gh td{background:#e2e8f0;font-weight:700;border:0}
.st td{background:#f1f5f9;font-weight:700;text-align:right}.st td:first-child{text-align:right;color:#475569}
tfoot td{position:sticky;bottom:0;background:#0f172a;color:#fff;font-weight:700;text-align:right;border:0}
.lk{color:var(--brand);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--brand)}.lk:hover{color:#1e3a8a}
.in{color:var(--in);font-weight:700}.out{color:var(--out);font-weight:700}.mu{color:var(--muted)}
.bg{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px}
.bg.neg{background:#fee2e2;color:#991b1b}.bg.zero{background:#fef3c7;color:#92400e}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
dialog{border:0;border-radius:18px;padding:0;width:min(900px,95vw);max-height:90vh;box-shadow:0 20px 50px rgba(15,23,42,.3)}
dialog::backdrop{background:rgba(15,23,42,.5)}
.dh{display:flex;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.dh h2{margin:0;font-size:17px}.dh p{margin:2px 0 0;color:var(--muted);font-size:13px}
.dk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 18px}.dk div{background:#f8fafc;border-radius:10px;padding:8px 10px}.dk small{display:block;color:var(--muted);font-size:11px}.dk b{font-size:16px}
.db{padding:0 18px 14px;overflow:auto;max-height:55vh}
.sign{display:none;justify-content:space-between;margin-top:36px;padding:0 40px;font-weight:700}
@media print{body{background:#fff}.top .acts,.bar,.chips,.kpis{display:none}.tw{max-height:none;overflow:visible;border:0;box-shadow:none}thead th{position:static}tfoot td{position:static}.sign{display:flex}.page{padding:0}}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div><h1>📦 Stock Ledger</h1><p id="sub">Al Meezan ERP · item-wise stock, in/out aur balance</p></div>
    <div class="acts"><button class="btn ghost" id="bCsv">⬇ CSV</button><button class="btn ghost" id="bPrint">🖨 Print / PDF</button><button class="btn ghost" id="bRef">⟳ Refresh</button><button class="btn danger" id="bClose">✕ Close</button></div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="card bar">
    <div class="seg" id="viewSeg"><button data-v="sum" class="on">Summary (item-wise)</button><button data-v="det">Detailed (har entry)</button></div>
    <div class="sq"><input id="q" type="search" placeholder="Search: company, category, product ID, model…"><button class="mic" id="mic" type="button" title="Voice search">🎤</button></div>
    <select id="cat"></select><select id="comp"></select>
    <select id="stat"><option value="">Har stock status</option><option value="in">Stock mein hai</option><option value="zero">Stock khatam (0)</option><option value="neg">Negative stock</option></select>
    <select id="preset"><option value="all">Poora record</option><option value="today">Aaj</option><option value="month">Is mahine</option><option value="lastmonth">Pichhla mahina</option><option value="last3">Pichhle 3 mahine</option><option value="year">Is saal</option><option value="custom">Custom</option></select>
    <input type="date" id="from" title="From"><input type="date" id="to" title="To">
    <label class="ck"><input type="checkbox" id="grp" checked> Category-wise grouping</label>
    <button class="btn ghost" id="bReset">↺ Reset</button>
  </section>
  <div class="chips" id="chips"></div>

  <div class="tw" id="tw"><table><thead id="th"></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>
  <div class="sign"><div>______________________<br>Prepared / Checked By</div><div>______________________<br>Authorized Signature</div></div>
</main>

<dialog id="dlg">
  <div class="dh"><div><h2 id="dT"></h2><p id="dS"></p></div><button class="btn ghost" id="dX">✕</button></div>
  <div class="dk" id="dK"></div>
  <div class="db"><table><thead><tr><th>Date</th><th>Reference</th><th>Vendor</th><th class="n">In</th><th class="n">Out</th><th class="n">Balance</th><th>Remarks</th></tr></thead><tbody id="dB"></tbody></table></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script>
<script>
const $ = id => document.getElementById(id), N = v => Number(v) || 0, fm = v => N(v).toLocaleString("en-US");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dOf = r => r.date ? String(r.date).split("T")[0] : "";
const fd = d => { const p = String(d || "").split("-"); return p.length === 3 ? +p[2] + "-" + +p[1] + "-" + p[0].slice(-2) : d || "-"; };
const keyOf = r => [r.product_id, r.company_name, r.product_category, r.model].map(x => x || "").join("|");
let ALL = [], VIEW = "sum", D = { per: [], items: [] };
const SORT = { sum: { k: "company", d: 1 }, det: { k: "_d", d: 1 } };
const COLS = {
  sum: [["company", "Company"], ["category", "Category"], ["pid", "Product ID"], ["model", "Model"], ["opn", "Opening", "n"], ["in", "In", "n"], ["out", "Out", "n"], ["close", "Closing", "n"]],
  det: [["_d", "Date"], ["company_name", "Company"], ["product_category", "Category"], ["product_id", "Product ID"], ["model", "Model"], ["vendor", "Vendor"], ["ref", "Reference"], ["qty_in", "In", "n"], ["qty_out", "Out", "n"], ["_bal", "Balance", "n"], ["remarks", "Remarks"]]
};

async function load() {
  document.body.style.cursor = "wait";
  try {
    ALL = (await ERP.db.stock.ledger()).map((r, i) => ({ ...r, _d: dOf(r), _k: keyOf(r), _i: i, ref: [r.reference_type, r.reference_id].filter(Boolean).join(" ") }));
    fill("cat", "Sab categories", "product_category"); fill("comp", "Sab companies", "company_name"); render();
  } catch (e) { alert("Stock data load nahi hua: " + e.message); } finally { document.body.style.cursor = ""; }
}
function fill(id, first, f) {
  const cur = $(id).value, v = [...new Set(ALL.map(r => r[f]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  $(id).innerHTML = `<option value="">${first}</option>` + v.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join(""); $(id).value = v.includes(cur) ? cur : "";
}

/* ---- core calculation: opening before "From", running balance per item inside the period ---- */
function compute() {
  const from = $("from").value, to = $("to").value, cat = $("cat").value, comp = $("comp").value, q = $("q").value.trim().toLowerCase(), stat = $("stat").value, det = VIEW === "det";
  const base = ALL.filter(r => (!cat || r.product_category === cat) && (!comp || r.company_name === comp) &&
    (!q || [r.company_name, r.product_category, r.product_id, r.model, ...(det ? [r.vendor, r.remarks, r.ref] : [])].join(" ").toLowerCase().includes(q)));
  const opn = new Map(), per = [];
  base.forEach(r => { if (from && r._d < from) opn.set(r._k, (opn.get(r._k) || 0) + N(r.qty_in) - N(r.qty_out)); else if (!to || r._d <= to) per.push(r); });
  per.sort((a, b) => a._d.localeCompare(b._d) || a._i - b._i);
  const bal = new Map(opn);
  per.forEach(r => { const b = (bal.get(r._k) || 0) + N(r.qty_in) - N(r.qty_out); bal.set(r._k, b); r._bal = b; });
  const it = new Map(), touch = r => { if (!it.has(r._k)) it.set(r._k, { k: r._k, company: r.company_name || "-", category: r.product_category || "-", pid: r.product_id || "-", model: r.model || "-", opn: opn.get(r._k) || 0, in: 0, out: 0 }); return it.get(r._k); };
  base.forEach(r => { if (from && r._d < from) touch(r); });
  per.forEach(r => { const o = touch(r); o.in += N(r.qty_in); o.out += N(r.qty_out); });
  let items = [...it.values()]; items.forEach(o => o.close = o.opn + o.in - o.out);
  if (stat) items = items.filter(o => stat === "in" ? o.close > 0 : stat === "zero" ? o.close === 0 : o.close < 0);
  const ok = new Set(items.map(o => o.k));
  D = { per: stat ? per.filter(r => ok.has(r._k)) : per, items };
}

function render() {
  compute();
  const det = VIEW === "det", cols = COLS[VIEW], rows = det ? D.per : D.items, gk = det ? "product_category" : "category", s = SORT[VIEW], grp = $("grp").checked;
  const sumIn = D.per.reduce((t, r) => t + N(r.qty_in), 0), sumOut = D.per.reduce((t, r) => t + N(r.qty_out), 0), val = D.per.reduce((t, r) => t + N(r.total_cost), 0);
  $("kpis").innerHTML = `<div class="kpi"><small>Items</small><b>${fm(D.items.length)}</b></div><div class="kpi i"><small>Total Qty In</small><b>${fm(sumIn)}</b></div><div class="kpi o"><small>Total Qty Out</small><b>${fm(sumOut)}</b></div><div class="kpi"><small>Closing Stock</small><b>${fm(D.items.reduce((t, o) => t + o.close, 0))}</b></div><div class="kpi"><small>Total Value (PKR)</small><b>Rs ${fm(val)}</b></div>`;
  $("sub").textContent = `${D.items.length} items · ${D.per.length} entries · ${$("from").value || "shuru"} → ${$("to").value || "aaj tak"}`;
  const chips = [["cat", "Category: " + $("cat").value, $("cat").value], ["comp", "Company: " + $("comp").value, $("comp").value], ["q", "Search: " + $("q").value, $("q").value.trim()], ["stat", "Status: " + $("stat").selectedOptions[0].text, $("stat").value]].filter(c => c[2]);
  $("chips").innerHTML = chips.map(c => `<span class="chip" data-x="${c[0]}">${esc(c[1])} ✕</span>`).join("");

  const val_ = (r, k) => r[k] == null ? "" : r[k];
  const cmp = (a, b) => { const x = val_(a, s.k), y = val_(b, s.k); return (typeof x === "number" || typeof y === "number" ? N(x) - N(y) : String(x).localeCompare(String(y), undefined, { numeric: true })) * s.d; };
  const list = rows.slice().sort(cmp); if (grp) list.sort((a, b) => String(a[gk] || "-").localeCompare(String(b[gk] || "-")));
  const lk = (t, kind, v) => `<a class="lk" data-f="${kind}" data-v="${esc(encodeURIComponent(v))}">${esc(t)}</a>`, it = r => `data-it="${esc(encodeURIComponent(r._k || r.k))}"`;
  const cell = (r, c) => { const k = c[0], v = r[k];
    if (det) { if (k === "_d") return fd(v); if (k === "company_name") return v ? lk(v, "company", v) : "-"; if (k === "product_category") return v ? lk(v, "category", v) : "-";
      if (k === "product_id" || k === "model") return v ? `<a class="lk" ${it(r)}>${esc(v)}</a>` : "-"; if (k === "vendor") return v ? lk(v, "vendor", v) : "-";
      if (k === "qty_in") return N(v) > 0 ? `<span class="in">+${fm(v)}</span>` : '<span class="mu">–</span>'; if (k === "qty_out") return N(v) > 0 ? `<span class="out">−${fm(v)}</span>` : '<span class="mu">–</span>';
      if (k === "_bal") return `<b class="${v < 0 ? "out" : ""}">${fm(v)}</b>`; return esc(v || "-"); }
    if (k === "company") return lk(v, "company", v); if (k === "category") return lk(v, "category", v); if (k === "pid" || k === "model") return `<a class="lk" ${it(r)}>${esc(v)}</a>`;
    if (k === "opn") return `<span class="mu">${fm(v)}</span>`; if (k === "in") return v > 0 ? `<span class="in">+${fm(v)}</span>` : '<span class="mu">–</span>'; if (k === "out") return v > 0 ? `<span class="out">−${fm(v)}</span>` : '<span class="mu">–</span>';
    return `<b class="${v < 0 ? "out" : ""}">${fm(v)}</b>${v < 0 ? '<span class="bg neg">Negative</span>' : v === 0 ? '<span class="bg zero">Out of stock</span>' : ""}`; };
  const first = cols.findIndex(c => c[2] === "n");
  const totRow = (arr, label, cls) => { const t = {}; cols.forEach(c => { if (c[2] === "n") t[c[0]] = arr.reduce((a, r) => a + N(r[c[0]]), 0); }); if (det) t._bal = t.qty_in - t.qty_out;
    return `<tr class="${cls}"><td colspan="${first}">${label}</td>${cols.slice(first).map(c => c[2] === "n" ? `<td class="n">${fm(t[c[0]])}</td>` : "<td></td>").join("")}</tr>`; };

  $("th").innerHTML = `<tr>${cols.map(c => `<th class="${c[2] || ""}" data-s="${c[0]}">${c[1]}${s.k === c[0] ? (s.d > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr>`;
  let h = "", cur = null, buf = [];
  const flush = () => { if (grp && buf.length) h += totRow(buf, "Subtotal — " + esc(cur), "st"); buf = []; };
  list.forEach(r => { const g = String(r[gk] || "-");
    if (grp && g !== cur) { flush(); cur = g; h += `<tr class="gh"><td colspan="${cols.length}">📁 ${esc(g)}</td></tr>`; }
    buf.push(r); h += `<tr>${cols.map(c => `<td class="${c[2] || ""}">${cell(r, c)}</td>`).join("")}</tr>`; });
  flush();
  $("tb").innerHTML = h || `<tr><td colspan="${cols.length}" class="empty">Koi record nahi mila. Filters badal kar ya Reset karke dekhein.</td></tr>`;
  $("tf").innerHTML = list.length ? totRow(list, "GRAND TOTAL", "gt") : "";
}

/* ---- item ledger popup (opening + running balance for chosen period) ---- */
function openItem(k) {
  const from = $("from").value, to = $("to").value; let opn = 0; const rows = [];
  ALL.forEach(r => { if (r._k !== k) return; if (from && r._d < from) opn += N(r.qty_in) - N(r.qty_out); else if (!to || r._d <= to) rows.push(r); });
  rows.sort((a, b) => a._d.localeCompare(b._d) || a._i - b._i);
  const m = ALL.find(r => r._k === k) || {}; let b = opn, ti = 0, to_ = 0;
  const body = rows.map(r => { b += N(r.qty_in) - N(r.qty_out); ti += N(r.qty_in); to_ += N(r.qty_out);
    return `<tr><td>${fd(r._d)}</td><td>${esc(r.ref || "-")}</td><td>${esc(r.vendor || "-")}</td><td class="n">${N(r.qty_in) > 0 ? `<span class="in">+${fm(r.qty_in)}</span>` : "–"}</td><td class="n">${N(r.qty_out) > 0 ? `<span class="out">−${fm(r.qty_out)}</span>` : "–"}</td><td class="n"><b class="${b < 0 ? "out" : ""}">${fm(b)}</b></td><td class="mu">${esc(r.remarks || "")}</td></tr>`; }).join("");
  $("dT").textContent = `${m.model || "-"} · ${m.product_id || "-"}`; $("dS").textContent = `${m.company_name || "-"} · ${m.product_category || "-"} · ${from || "shuru"} → ${to || "aaj tak"}`;
  $("dK").innerHTML = `<div><small>Opening</small><b>${fm(opn)}</b></div><div><small>Total In</small><b class="in">+${fm(ti)}</b></div><div><small>Total Out</small><b class="out">−${fm(to_)}</b></div><div><small>Closing</small><b>${fm(opn + ti - to_)}</b></div>`;
  $("dB").innerHTML = `<tr><td colspan="5" class="mu">Opening balance</td><td class="n"><b>${fm(opn)}</b></td><td></td></tr>` + (body || '<tr><td colspan="7" class="empty">Is period mein koi entry nahi.</td></tr>');
  $("dlg").showModal();
}

/* ---- events ---- */
$("tw").onclick = e => {
  const th = e.target.closest("th[data-s]"); if (th) { const s = SORT[VIEW]; if (s.k === th.dataset.s) s.d = -s.d; else { s.k = th.dataset.s; s.d = 1; } return render(); }
  const f = e.target.closest("[data-f]"); if (f) { const v = decodeURIComponent(f.dataset.v);
    if (f.dataset.f === "company") $("comp").value = v; else if (f.dataset.f === "category") $("cat").value = v; else $("q").value = v; return render(); }
  const i = e.target.closest("[data-it]"); if (i) openItem(decodeURIComponent(i.dataset.it)); };
$("chips").onclick = e => { const c = e.target.closest("[data-x]"); if (c) { $(c.dataset.x).value = ""; render(); } };
$("viewSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; VIEW = b.dataset.v; $("viewSeg").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); render(); };
let tm; $("q").oninput = () => { clearTimeout(tm); tm = setTimeout(render, 150); };
["cat", "comp", "stat", "grp"].forEach(id => $(id).onchange = render);
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
$("preset").onchange = () => { const p = $("preset").value, t = new Date(), y = t.getFullYear(), m = t.getMonth(), D_ = (a, b, c) => new Date(a, b, c, 12); let a = null, b = null;
  if (p === "today") a = b = t; else if (p === "month") { a = D_(y, m, 1); b = t; } else if (p === "lastmonth") { a = D_(y, m - 1, 1); b = D_(y, m, 0); } else if (p === "last3") { a = D_(y, m - 2, 1); b = t; } else if (p === "year") { a = D_(y, 0, 1); b = t; }
  if (p !== "custom") { $("from").value = a ? iso(a) : ""; $("to").value = b ? iso(b) : ""; } render(); };
$("from").onchange = $("to").onchange = () => { $("preset").value = "custom"; render(); };
$("bReset").onclick = () => { ["q", "cat", "comp", "stat", "from", "to"].forEach(id => $(id).value = ""); $("preset").value = "all"; render(); };
$("bRef").onclick = load; $("bPrint").onclick = () => window.print(); $("dX").onclick = () => $("dlg").close();
$("bClose").onclick = () => window.top.go ? window.top.go(null) : history.back();
$("bCsv").onclick = () => {
  const det = VIEW === "det", rows = det ? D.per.map(r => ({ date: r._d, company: r.company_name, category: r.product_category, product_id: r.product_id, model: r.model, color: r.color, vendor: r.vendor, reference: r.ref, warehouse: r.warehouse, qty_in: r.qty_in, qty_out: r.qty_out, balance: r._bal, remarks: r.remarks }))
    : D.items.map(o => ({ company: o.company, category: o.category, product_id: o.pid, model: o.model, opening: o.opn, qty_in: o.in, qty_out: o.out, closing: o.close }));
  if (!rows.length) return alert("Export ke liye koi data nahi."); ERP.ui.downloadCSV(`stock_${det ? "detailed" : "summary"}_${ERP.ui.today()}.csv`, rows); };

/* voice search (Chrome) */
(() => { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
  $("mic").onclick = () => { if (!SR) return alert("Voice input ke liye Chrome use karein."); if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; $("mic").classList.add("on");
    rec.onresult = ev => { $("q").value = [...ev.results].map(r => r[0].transcript).join(" ").trim(); $("q").dispatchEvent(new Event("input")); };
    rec.onend = () => { rec = null; $("mic").classList.remove("on"); }; try { rec.start(); } catch (e) { rec = null; } }; })();

(async () => { try { await ERP.auth.guard(); await load(); } catch (e) { alert("Stock Ledger open nahi hua: " + e.message); } })();
</script>
</body>
</html>
