<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .head,.row{display:grid;align-items:center;gap:10px;grid-template-columns:44px minmax(150px,2.2fr) 1fr 1.1fr 1fr 1.1fr 100px}
  .head{padding:0 14px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .head span:first-child{grid-column:1/3}
  .row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
  .row:hover,.row:focus-visible{border-color:var(--brand)}
  .who b{display:block;line-height:1.25}.who small,.meta{color:var(--muted);font-size:13px}
  .meta{display:contents}
  .bal{font-weight:700;font-variant-numeric:tabular-nums}.bal.due{color:var(--warn)}.bal.ok{color:#047857}
  .act{display:flex;gap:6px;justify-content:flex-end}
  .act button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;font-size:16px}
  .act button:disabled{opacity:.35;cursor:default}
  .balbox{border-radius:var(--radius);padding:14px;margin-bottom:12px;color:#fff;background:#047857}
  .balbox.due{background:var(--warn)}.balbox small{opacity:.85}.balbox b{display:block;font-size:28px}.balbox span{font-size:12px;opacity:.9}
  .gcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
  @media(max-width:759px){
    .head{display:none}
    .row{grid-template-columns:44px 1fr auto;grid-template-areas:"av who bal" "av meta act"}
    .row .av{grid-area:av}.row .who{grid-area:who}.row .bal{grid-area:bal;text-align:right}
    .row .meta{grid-area:meta;display:flex;gap:4px 10px;flex-wrap:wrap;align-self:start}
    .row .act{grid-area:act}.meta .cro:empty{display:none}
  }
</style>
</head>
<body>
<main class="page">
  <header class="appbar">
    <div><h1>Customers</h1><p id="sub">Loading...</p></div>
    <div class="bar-actions"><button class="btn ghost" id="btnExport">Export</button><button class="btn" id="btnNew">＋ New customer</button></div>
  </header>

  <div class="card" id="notice" hidden style="border-color:#f59e0b;background:#fffbeb"></div>
  <section class="stats" id="stats" data-feature="show_balance_summary"></section>

  <section class="card toolbar">
    <div class="search"><input id="q" type="search" placeholder="Search name, account, mobile or CNIC" autocomplete="off"></div>
    <select id="fCro" aria-label="CRO"></select>
    <select id="fSort" aria-label="Sort"><option value="new">Newest first</option><option value="name">Name A-Z</option><option value="bal">Highest balance</option></select>
    <button class="chip" id="chipDue" aria-pressed="false">Balance due</button>
    <button class="btn ghost mini" id="bulkCROBtn" type="button">Bulk CRO move</button>
  </section>

  <div class="head"><span>Customer</span><span>Account</span><span>Mobile</span><span>CRO</span><span style="text-align:right">Balance</span><span></span></div>
  <section id="list"></section>
  <div style="text-align:center;margin:8px 0 24px"><button class="btn ghost" id="more" hidden></button></div>
</main>

<dialog id="profile" class="sheet"></dialog>

<dialog id="formDlg" class="sheet">
  <div class="sh-head"><div><h2 id="fTitle">New customer</h2><p id="fAcc"></p></div><button class="x" data-close aria-label="Close">✕</button></div>
  <form id="frm" class="sh-body" novalidate onsubmit="return false"></form>
  <div class="sh-foot">
    <button class="btn danger" id="btnDel" hidden style="margin-right:auto">Delete</button>
    <button class="btn ghost" data-close>Cancel</button>
    <button class="btn" id="btnSave">Save customer</button>
  </div>
</dialog>

<dialog id="bulkCRODialog" class="sheet">
  <div class="sh-head">
    <div><h2>Bulk CRO reassign</h2><p>Move one CRO group or selected customers to another CRO</p></div>
    <button class="x" type="button" data-close aria-label="Close">✕</button>
  </div>
  <div class="sh-body">
    <div class="fsec">
      <div class="fgrid">
        <div class="fld">
          <label>Source CRO</label>
          <select id="bulkSourceCRO"></select>
        </div>
        <div class="fld">
          <label>Target CRO</label>
          <select id="bulkTargetCRO"></select>
        </div>
      </div>
    </div>

    <div class="fsec">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <strong id="bulkListTitle">Customers</strong>
        <label style="display:flex;align-items:center;gap:8px;margin:0"><input type="checkbox" id="bulkSelectAll"> Select all</label>
      </div>
      <div id="bulkCROList" class="table-wrap" style="max-height:420px;overflow:auto"></div>
    </div>
  </div>
  <div class="sh-foot">
    <button class="btn ghost" type="button" data-close>Cancel</button>
    <button class="btn" type="button" id="bulkMoveSelectedBtn">Move selected</button>
    <button class="btn danger" type="button" id="bulkMoveAllBtn">Move all from source</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script><script src="js/voice.js"></script>
<script>
const SO = "S/O D/O W/O", $ = id => document.getElementById(id), E = ERP.ui.esc, M = ERP.ui.money;
const digits = s => String(s || "").replace(/\D/g, ""), key = c => String(c.account_no || "").trim();
let ALL = [], BAL = new Map(), shown = 50, editing = null, dueOnly = false;
const bal = c => Number((BAL.get(key(c)) || {}).balance) || 0;

/* ---------- form definition ---------- */
const SECT = [
  ["Customer details", [["account_title","Full name *","text",{mic:1,wide:1}],[SO,"S/O, D/O or W/O","text",{mic:1}],["cnic_no","CNIC","text",{m:"cnic",ph:"35202-1234567-1"}],
    ["mobile_number","Mobile","text",{m:"mob",ph:"0300-1234567"}],["address","Address","text",{mic:1,wide:1}]]],
  ["Employment", [["department","Department","text",{mic:1}],["designation","Designation","text",{mic:1}],["salary","Monthly salary (Rs)","number",{}]]],
  ["Guarantor 1", [["guarantor_1_name","Name","text",{mic:1}],["guarantor_1_mobile","Mobile","text",{m:"mob",ph:"0300-1234567"}],["guarantor_1_dept","Department","text",{mic:1}],["guarantor_1_designation","Designation","text",{mic:1}]]],
  ["Guarantor 2", [["guarantor_2_name","Name","text",{mic:1}],["guarantor_2_mobile","Mobile","text",{m:"mob",ph:"0300-1234567"}],["guarantor_2_dept","Department","text",{mic:1}],["guarantor_2_designation","Designation","text",{mic:1}]]]
];
const fld = ([k, label, type, o]) => `<div class="fld${o.wide ? " wide" : ""}"><label>${label}</label><div class="inp"><input data-k="${k}" type="${type}" ${o.m ? `data-mask="${o.m}" inputmode="numeric"` : ""} ${type === "number" ? 'inputmode="decimal" min="0"' : ""} ${o.ph ? `placeholder="${o.ph}"` : ""} autocomplete="off">${o.mic ? '<button type="button" class="mic" aria-label="Voice input" tabindex="-1">🎤</button>' : ""}</div><small class="err"></small></div>`;
function buildForm() {
  $("frm").innerHTML = SECT.map(([t, fs]) => `<fieldset class="fsec" style="border:1px solid var(--line)"><legend>${t}</legend><div class="fgrid">${fs.map(fld).join("")}</div></fieldset>`).join("")
    + `<fieldset class="fsec" style="border:1px solid var(--line)"><legend>Approval</legend><div class="fgrid"><div class="fld"><label>CRO</label><select data-k="cro"></select></div><div class="fld"><label>Approved by</label><select data-k="approved_by"></select></div></div></fieldset>`;
  $("frm").addEventListener("input", e => { const m = e.target.dataset.mask; if (m) e.target.value = fmt(m, e.target.value); e.target.classList.remove("bad"); const er = e.target.closest(".fld"); if (er) er.querySelector(".err").textContent = ""; });
  ERP.voice.wire($("frm"));
}
function fmt(m, v) {
  const d = digits(v);
  if (m === "cnic") return [d.slice(0, 5), d.slice(5, 12), d.slice(12, 13)].filter(Boolean).join("-");
  return d.length > 4 ? d.slice(0, 4) + "-" + d.slice(4, 11) : d;
}

/* ---------- data ---------- */
async function load() {
  $("list").innerHTML = '<div class="card"><div class="skeleton" style="width:50%"></div><br><div class="skeleton"></div></div>'.repeat(4);
  try {
    const [c, s] = await Promise.all([ERP.db.customers.list(), ERP.db.settings().catch(() => ({ rows: [] }))]);
    let b = []; try { b = await ERP.db.customers.balances(c); } catch (er) { ERP.ui.toast("Balances unavailable (run sql/08): " + er.message, "err"); }
    ALL = c; BAL = new Map(b.map(x => [String(x.account_no).trim(), x]));
    const names = cat => s.rows.filter(r => String(r.category || "").trim().toUpperCase() === cat).map(r => String(r.display_name || r.lookup_code || "").trim()).filter(Boolean);
    window.CRO = [...new Set(names("CRO"))].sort();
    window.APP = [...new Set(names("APPROVED_BY"))].sort();
    const selected = $("fCro").value || "";
    const options = ['<option value="">All CROs</option>',
      ...window.CRO.map(x => `<option value="${E(x)}" ${selected === x ? "selected" : ""}>${E(x)}</option>`)];
    $("fCro").innerHTML = options.join("");
    if (selected && !window.CRO.includes(selected)) $("fCro").value = "";
    render(); checkAccess();
  } catch (e) { $("list").innerHTML = `<div class="empty">Could not load customers.<br><small>${E(e.message)}</small></div>`; }
}

function render() {
  const q = $("q").value.trim().toLowerCase(), qd = digits(q), cro = $("fCro").value, sort = $("fSort").value;
  let rows = ALL.filter(c => (!cro || c.cro === cro) && (!dueOnly || bal(c) > 0) && (!q ||
    String(c.account_title || "").toLowerCase().includes(q) || key(c).includes(q) || String(c[SO] || "").toLowerCase().includes(q) ||
    (qd && (digits(c.mobile_number).includes(qd) || digits(c.cnic_no).includes(qd)))));
  const num = c => Number(digits(c.account_no)) || 0;
  rows.sort(sort === "name" ? (a, b) => String(a.account_title).localeCompare(String(b.account_title)) : sort === "bal" ? (a, b) => bal(b) - bal(a) : (a, b) => num(b) - num(a));

  const due = ALL.filter(c => bal(c) > 0);
  $("stats").innerHTML = `<div class="stat"><small>Customers</small><b>${M(ALL.length)}</b></div><div class="stat due"><small>With balance due</small><b>${M(due.length)}</b></div><div class="stat"><small>Total outstanding</small><b>Rs ${M(due.reduce((s, c) => s + bal(c), 0))}</b></div>`;
  $("sub").textContent = rows.length === ALL.length ? `${M(ALL.length)} customers` : `${M(rows.length)} of ${M(ALL.length)} customers`;

  $("list").innerHTML = rows.slice(0, shown).map(c => {
    const b = bal(c), ini = String(c.account_title || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
    return `<article class="row" data-a="${E(key(c))}" tabindex="0">
      <div class="av" style="background:hsl(${(num(c) * 47) % 360} 45% 38%)">${E(ini)}</div>
      <div class="who"><b>${E(c.account_title)}</b><small>${E(c[SO])}</small></div>
      <div class="meta"><span>${E(key(c))}</span><span>${E(c.mobile_number)}</span><span class="cro">${E(c.cro)}</span></div>
      <div class="bal ${b > 0 ? "due" : "ok"}">${b > 0 ? "Rs " + M(b) : "Clear"}</div>
      <div class="act"><button data-act="wa" title="WhatsApp" ${digits(c.mobile_number) ? "" : "disabled"}>💬</button><button data-act="call" title="Call" ${digits(c.mobile_number) ? "" : "disabled"}>📞</button></div></article>`;
  }).join("") || '<div class="empty">No customers match your search.</div>';
  $("more").hidden = rows.length <= shown; $("more").textContent = `Show more (${M(rows.length - shown)} remaining)`;
}

/* ---------- actions ---------- */
function waUrl(c) {
  let d = digits(c.mobile_number); d = d.startsWith("92") ? d : "92" + d.replace(/^0/, ""); const b = bal(c);
  const msg = `Assalam o Alaikum ${c.account_title}, ` + (b > 0 ? `aap ka CAF ${key(c)} ka baqaya Rs ${M(b)} hai. Meherbani karke ada kar dein. Shukriya - Al Meezan` : `Al Meezan ki taraf se salam.`);
  return `https://wa.me/${d}?text=${encodeURIComponent(msg)}`;
}
const find = acc => ALL.find(c => key(c) === acc);
$("list").onclick = e => {
  const row = e.target.closest(".row"); if (!row) return; const c = find(row.dataset.a), act = e.target.closest("[data-act]");
  if (act) { e.stopPropagation(); return act.dataset.act === "wa" ? window.open(waUrl(c), "_blank", "noopener") : (location.href = "tel:" + digits(c.mobile_number)); }
  openProfile(c);
};
$("list").onkeydown = e => { if (e.key === "Enter" && e.target.classList.contains("row")) openProfile(find(e.target.dataset.a)); };
document.addEventListener("click", e => { const d = e.target.closest("dialog"); if (e.target.closest("[data-close]") && d) d.close(); });

const kv = (l, v) => `<div><dt>${l}</dt><dd>${E(v) || "—"}</dd></div>`;
async function assignCustomerCRO(accNo, newCRO) {
  const clean = String(newCRO || "").trim();
  if (!clean) return ERP.ui.toast("Choose a CRO first", "err");
  try {
    await ERP.db.customers.update(accNo, { cro: clean });
    ERP.ui.toast(`Customer moved to ${clean}`, "ok");
    await load();
    const refreshed = find(accNo);
    if (refreshed) openProfile(refreshed);
  } catch (e) { ERP.ui.toast(e.message || "Could not reassign CRO", "err"); }
}

function openProfile(c) {
  const b = BAL.get(key(c)) || {}, bl = bal(c), ini = String(c.account_title || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const g = n => c["guarantor_" + n + "_name"] ? `<div class="gcard"><b>Guarantor ${n}</b><dl class="kv" style="margin-top:8px">${kv("Name", c["guarantor_" + n + "_name"])}${kv("Mobile", c["guarantor_" + n + "_mobile"])}${kv("Department", c["guarantor_" + n + "_dept"])}${kv("Designation", c["guarantor_" + n + "_designation"])}</dl></div>` : "";
  const croOptions = [...new Set((window.CRO || []).filter(Boolean))].sort();
  $("profile").innerHTML = `<div class="sh-head"><div class="av lg" style="background:hsl(${(Number(digits(c.account_no)) * 47) % 360} 45% 38%)">${E(ini)}</div>
      <div><h2>${E(c.account_title)}</h2><p>CAF ${E(key(c))}${c[SO] ? " · " + E(c[SO]) : ""}</p></div><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="sh-body"><div class="balbox ${bl > 0 ? "due" : ""}"><small>Outstanding balance</small><b>${bl > 0 ? "Rs " + M(bl) : "Clear"}</b>
      <span>Sale ${M(b.total_sale)} · Received ${M(b.received)}</span></div>
      <div class="fsec"><dl class="kv">${kv("Mobile", c.mobile_number)}${kv("CNIC", c.cnic_no)}${kv("Address", c.address)}${kv("CRO", c.cro || "Unassigned")}${kv("Approved by", c.approved_by)}${kv("Department", c.department)}${kv("Designation", c.designation)}${kv("Salary", c.salary ? "Rs " + M(c.salary) : "")}</dl></div>
      <div class="gcard"><h3 style="margin:0 0 8px">CRO assignment</h3><div class="fgrid" style="grid-template-columns:1fr auto"><select id="pTransferCRO"><option value="">Select active CRO...</option>${croOptions.map(x => `<option value="${E(x)}" ${String(c.cro || "").trim() === x ? "selected" : ""}>${E(x)}</option>`).join("")}</select><button class="btn sm" id="pTransferBtn" ${!(window.CRO && window.CRO.length) ? "disabled" : ""}>Save</button></div></div>${g(1)}${g(2)}</div>
    <div class="sh-foot"><a class="btn ghost" style="display:inline-grid;place-items:center;text-decoration:none" href="LedgerView.html?accNo=${encodeURIComponent(key(c))}">Ledger</a>
      <button class="btn ghost" id="pWa" ${digits(c.mobile_number) ? "" : "disabled"}>WhatsApp</button>
      ${ERP.auth.can("edit") ? '<button class="btn" id="pEdit">Edit</button>' : ""}</div>`;
  $("pWa").onclick = () => window.open(waUrl(c), "_blank", "noopener");
  $("pTransferBtn").onclick = () => assignCustomerCRO(key(c), $("pTransferCRO").value);
  if ($("pEdit")) $("pEdit").onclick = () => { $("profile").close(); openForm(c); };
  $("profile").showModal();
}

function populateBulkCROOptions() {
  const source = [...new Set((window.CRO || []).filter(Boolean))].sort();
  const target = [...new Set((window.CRO || []).filter(Boolean))].sort();
  $("bulkSourceCRO").innerHTML = '<option value="">Select source CRO</option>' + source.map(x => `<option value="${E(x)}">${E(x)}</option>`).join("");
  $("bulkTargetCRO").innerHTML = '<option value="">Select target CRO</option>' + target.map(x => `<option value="${E(x)}">${E(x)}</option>`).join("");
}

function renderBulkCustomers() {
  const source = $("bulkSourceCRO").value;
  const sourceRows = source ? ALL.filter(c => String(c.cro || "").trim() === source) : [];
  $("bulkListTitle").textContent = source ? `Customers in ${source} (${sourceRows.length})` : "Customers";
  if (!source || !sourceRows.length) {
    $("bulkCROList").innerHTML = '<div class="empty">Select a source CRO to load its customers.</div>';
    $("bulkSelectAll").checked = false;
    return;
  }

  $("bulkCROList").innerHTML = sourceRows.map(c => `
    <label style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff">
      <span style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <input type="checkbox" class="bulk-customer-check" data-acc="${E(key(c))}" checked>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(c.account_title)} (${E(key(c))})</span>
      </span>
      <small style="color:var(--muted)">${E(c.mobile_number || "")}</small>
    </label>
  `).join("");
  $("bulkSelectAll").checked = true;
}

async function bulkReassignCustomers(accNos, targetCRO) {
  const cleanTarget = String(targetCRO || "").trim();
  if (!cleanTarget) return ERP.ui.toast("Please choose the target CRO", "err");
  if (!accNos.length) return ERP.ui.toast("No customers selected", "err");

  try {
    await ERP.ui.busy($("bulkMoveSelectedBtn"), async () => {
      for (const accNo of accNos) {
        await ERP.db.customers.update(accNo, { cro: cleanTarget });
      }
    });
    ERP.ui.toast(`${accNos.length} customer(s) moved to ${cleanTarget}`, "ok");
    $("bulkCRODialog").close();
    await load();
  } catch (e) {
    ERP.ui.toast(e.message || "Could not reassign customers", "err");
  }
}

$("bulkCROBtn").onclick = () => {
  populateBulkCROOptions();
  $("bulkSourceCRO").value = "";
  $("bulkTargetCRO").value = "";
  $("bulkSelectAll").checked = false;
  $("bulkCROList").innerHTML = '<div class="empty">Select a source CRO to load its customers.</div>';
  $("bulkCRODialog").showModal();
};

$("bulkSourceCRO").onchange = renderBulkCustomers;
$("bulkSelectAll").onchange = () => {
  document.querySelectorAll(".bulk-customer-check").forEach(box => { box.checked = $("bulkSelectAll").checked; });
};

$("bulkMoveSelectedBtn").onclick = () => {
  const selected = [...document.querySelectorAll(".bulk-customer-check:checked")].map(x => x.dataset.acc);
  const target = $("bulkTargetCRO").value;
  bulkReassignCustomers(selected, target);
};

$("bulkMoveAllBtn").onclick = () => {
  const source = $("bulkSourceCRO").value;
  const target = $("bulkTargetCRO").value;
  if (!source) return ERP.ui.toast("Choose the source CRO first", "err");
  const allAcc = ALL.filter(c => String(c.cro || "").trim() === source).map(c => key(c));
  if (!allAcc.length) return ERP.ui.toast("No customers found in this source CRO", "err");
  if (!confirm(`Move all ${allAcc.length} customers from ${source} to ${target || "selected target"}?`)) return;
  bulkReassignCustomers(allAcc, target);
};

function fillSel(el, list, cur) {
  const safeList = [...new Set(list.filter(Boolean))];
  el.innerHTML = '<option value="">Select...</option>' + safeList.map(x => `<option value="${E(x)}">${E(x)}</option>`).join("");
  el.value = safeList.includes((cur || "").trim()) ? (cur || "").trim() : "";
}
async function checkAccess() {
  const n = $("notice"); if (ALL.length) { n.hidden = true; return; }
  const s = await ERP.auth.session(); n.hidden = false;
  n.innerHTML = !s ? '<b>You are not logged in, so the database shows nothing.</b> <a href="login.html">Log in</a>. Not sure why? Open <a href="status.html">Connection check</a>.'
    : `<b>No customers visible.</b> You are logged in as ${E(s.user.email)}. Either the table is empty, or this account has no role yet: run sql/02_add_users.sql with this email.`;
}
function nextPreview() { return String(Math.max(7860000, ...ALL.map(c => Number(digits(c.account_no)) || 0)) + 1); }
function openForm(c) {
  editing = c ? key(c) : null;
  $("fTitle").textContent = c ? "Edit customer" : "New customer";
  $("fAcc").textContent = c ? "CAF " + key(c) : "Finding the next CAF number...";
  if (!c) ERP.db.customers.peekNextNo().then(n => { if (!editing) $("fAcc").textContent = n ? "Next CAF number: " + n + " (assigned when you save)" : "CAF number is assigned when you save"; })
    .catch(() => { if (!editing) $("fAcc").textContent = "CAF number is assigned when you save (could not read the next number: log in first)"; });
  document.querySelectorAll("#frm [data-k]").forEach(el => {
    const k = el.dataset.k, v = c ? (c[k] ?? "") : "";
    if (k === "cro") fillSel(el, window.CRO || [], v); else if (k === "approved_by") fillSel(el, window.APP || [], v);
    else { el.value = v; if (el.dataset.mask) el.value = fmt(el.dataset.mask, el.value); }
    el.classList.remove("bad"); el.closest(".fld").querySelector(".err") && (el.closest(".fld").querySelector(".err").textContent = "");
  });
  $("btnDel").hidden = !(c && ERP.auth.can("delete"));
  $("formDlg").showModal(); $("frm").scrollTop = 0;
}

function collect() {
  const d = {};
  document.querySelectorAll("#frm [data-k]").forEach(el => { let v = el.value.trim(); const k = el.dataset.k;
    if (el.dataset.mask === "mob") v = digits(v); if (k === "salary") v = v === "" ? null : Number(v); d[k] = v; });
  if (editing && !d.cro) {
    const current = find(editing);
    if (current && current.cro && !(window.CRO || []).includes(String(current.cro).trim())) d.cro = current.cro;
  }
  return d;
}
function validate(d) {
  let ok = true; const bad = (k, m) => { const el = document.querySelector(`#frm [data-k="${k}"]`); el.classList.add("bad"); el.closest(".fld").querySelector(".err").textContent = m; ok = false; };
  if (!d.account_title || d.account_title.length < 3) bad("account_title", "Please enter the customer's name");
  if (d.cnic_no && digits(d.cnic_no).length !== 13) bad("cnic_no", "CNIC must be 13 digits");
  ["mobile_number", "guarantor_1_mobile", "guarantor_2_mobile"].forEach(k => { if (d[k] && !/^03\d{9}$/.test(d[k])) bad(k, "Mobile must be 11 digits starting with 03"); });
  if (d.salary != null && (isNaN(d.salary) || d.salary < 0)) bad("salary", "Invalid amount");
  const first = document.querySelector("#frm .bad"); if (first) { first.scrollIntoView({ block: "center" }); first.focus(); }
  return ok;
}
$("btnSave").onclick = async () => {
  const d = collect(); if (!validate(d)) return;
  const dup = d.cnic_no && ALL.find(x => digits(x.cnic_no) === digits(d.cnic_no) && key(x) !== editing);
  if (dup && !confirm(`This CNIC already belongs to ${dup.account_title} (CAF ${key(dup)}).\nSave anyway?`)) return;
  await ERP.ui.busy($("btnSave"), async () => {
    try {
      if (editing) { await ERP.db.customers.update(editing, d); ERP.ui.toast("Customer updated"); }
      else { const r = await ERP.db.customers.create(d); ERP.ui.toast("Saved. CAF number: " + r.account_no); }
      $("formDlg").close(); await load();
    } catch (e) { ERP.ui.toast(e.message, "err"); }
  });
};
$("btnDel").onclick = async () => {
  const c = find(editing), b = BAL.get(editing) || {};
  if (Number(b.total_sale) > 0 || Number(b.received) > 0) return ERP.ui.toast("This customer has sales/receipts, so it cannot be deleted.", "err");
  if (!confirm(`Delete ${c.account_title} (CAF ${editing})? This cannot be undone.`)) return;
  try { await ERP.db.customers.remove(editing); ERP.ui.toast("Customer deleted"); $("formDlg").close(); await load(); } catch (e) { ERP.ui.toast(e.message, "err"); }
};

/* ---------- wiring ---------- */
$("btnNew").onclick = () => openForm(null);
$("more").onclick = () => { shown += 50; render(); };
$("q").oninput = ERP.ui.debounce(() => { shown = 50; render(); }, 200);
$("fCro").onchange = $("fSort").onchange = () => { shown = 50; render(); };
$("chipDue").onclick = e => { dueOnly = !dueOnly; e.currentTarget.setAttribute("aria-pressed", dueOnly); shown = 50; render(); };
$("btnExport").onclick = () => ERP.ui.downloadCSV("customers_" + ERP.ui.today() + ".csv", ALL.map(c => ({ ...c, balance: bal(c) })));
(async () => { await ERP.auth.guard(); if (!ERP.auth.can("write")) $("btnNew").hidden = true; buildForm(); load(); })();
</script>
