<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products</title>
<link rel="stylesheet" href="css/app.css">
<style>
  .head,.row{display:grid;align-items:center;gap:10px;grid-template-columns:minmax(200px,2.4fr) 1.2fr 1fr 1fr 90px}
  .head{padding:0 14px 6px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
  .row:hover,.row:focus-visible{border-color:var(--brand)}
  .row b{display:block;line-height:1.25}.row small{color:var(--muted)}
  .stk{justify-self:end;font-weight:700;min-width:60px;text-align:center}
  .num{font-variant-numeric:tabular-nums}
  @media(max-width:759px){.head{display:none}.row{grid-template-columns:1fr auto;grid-template-areas:"n s" "m s" "p p"}
    .row .n{grid-area:n}.row .m{grid-area:m}.row .stk{grid-area:s}.row .p{grid-area:p;display:flex;gap:14px;font-size:13px;color:var(--muted)}.row .p span:empty{display:none}.row .hide-m{display:none}}
  .row .p{display:contents}@media(max-width:759px){.row .p{display:flex}}
</style>
</head>
<body>
<main class="page">
  <header class="appbar"><div><h1>Products</h1><p id="sub">Loading...</p></div>
    <div class="bar-actions"><button class="btn ghost" id="btnExport">Export</button><button class="btn" id="btnNew">＋ New product</button></div></header>
  <section class="stats" id="stats"></section>
  <section class="card toolbar">
    <div class="search"><input id="q" type="search" placeholder="Search brand, model, color or ID" autocomplete="off"></div>
    <select id="fCat" aria-label="Category"></select>
    <select id="fSort" aria-label="Sort"><option value="new">Newest first</option><option value="name">Brand / model A-Z</option><option value="stock">Most stock</option></select>
    <button class="chip" id="chipStock" aria-pressed="false">In stock only</button>
  </section>
  <div class="head"><span>Product</span><span>Brand / Category</span><span style="text-align:right">Cost</span><span style="text-align:right">MRP</span><span style="text-align:right">Stock</span></div>
  <section id="list"></section>
  <div style="text-align:center;margin:8px 0 24px"><button class="btn ghost" id="more" hidden></button></div>
</main>

<dialog id="dlg" class="sheet">
  <div class="sh-head"><div><h2 id="dTitle">New product</h2><p id="dSub"></p></div><button class="x" data-close aria-label="Close">✕</button></div>
  <form id="frm" class="sh-body" novalidate onsubmit="return false"><div class="fsec"><div class="fgrid">
    <div class="fld"><label>Category *</label><input id="fCategory" list="dCat" autocomplete="off" placeholder="e.g. MOBILE"><small class="err"></small></div>
    <div class="fld"><label>Brand / Company *</label><input id="fBrand" list="dBrand" autocomplete="off" placeholder="e.g. SAMSUNG"><small class="err"></small></div>
    <div class="fld"><label>Model *</label><input id="fModel" list="dModel" autocomplete="off"><small class="err"></small></div>
    <div class="fld"><label>Color</label><input id="fColor" list="dColor" autocomplete="off"></div>
    <div class="fld mob"><label>RAM (GB)</label><input id="fRam" inputmode="numeric" list="dRam" autocomplete="off"></div>
    <div class="fld mob"><label>Storage / ROM (GB)</label><input id="fRom" inputmode="numeric" list="dRom" autocomplete="off"></div>
    <div class="fld"><label>Cost price (Rs)</label><input id="fCost" type="number" inputmode="decimal" min="0"><small class="err"></small></div>
    <div class="fld"><label>MRP / sale price (Rs)</label><input id="fMrp" type="number" inputmode="decimal" min="0"><small class="err"></small></div>
    <div class="fld wide"><label>Remarks</label><input id="fRem" autocomplete="off"></div></div></div>
    <p style="font-size:12px;color:var(--muted);margin:0">Cost and MRP are optional. They pre-fill automatically when you add this product to a purchase.</p></form>
  <div class="sh-foot"><button class="btn danger" id="btnDel" hidden style="margin-right:auto">Delete</button><button class="btn ghost" data-close>Cancel</button><button class="btn" id="btnSave">Save product</button></div>
  <datalist id="dCat"></datalist><datalist id="dBrand"></datalist><datalist id="dModel"></datalist><datalist id="dColor"></datalist><datalist id="dRam"></datalist><datalist id="dRom"></datalist>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/ui.js"></script><script src="js/db.js"></script><script src="js/auth.js"></script>
<script>
const $ = id => document.getElementById(id), E = ERP.ui.esc, M = ERP.ui.money, up = s => String(s || "").trim().toUpperCase();
let ALL = [], STK = new Map(), shown = 50, editing = null, onlyStock = false;
const stock = p => STK.get(String(p.product_id)) || 0;
const gb = v => { v = String(v || "").trim(); return v ? (/gb/i.test(v) ? v : v + " GB") : ""; };
const num = v => String(v || "").replace(/\D/g, "");
document.addEventListener("click", e => { const d = e.target.closest("dialog"); if (e.target.closest("[data-close]") && d) d.close(); });

async function load() {
  $("list").innerHTML = '<div class="card"><div class="skeleton" style="width:50%"></div><br><div class="skeleton"></div></div>'.repeat(4);
  try {
    const [pr, st] = await Promise.all([ERP.db.products.list(), ERP.db.stock.balance()]);
    ALL = pr; STK = new Map();
    st.forEach(r => STK.set(String(r.product_id), (STK.get(String(r.product_id)) || 0) + Number(r.in_stock || 0)));
    const u = k => [...new Set(ALL.map(p => up(p[k])).filter(Boolean))].sort();
    const dl = (id, k, f) => $(id).innerHTML = u(k).map(v => `<option value="${E(f ? f(v) : v)}">`).join("");
    dl("dCat", "product_category"); dl("dBrand", "company_name"); dl("dModel", "model"); dl("dColor", "color");
    $("dRam").innerHTML = [...new Set(ALL.map(p => num(p.ram)).filter(Boolean))].sort((a, b) => a - b).map(v => `<option value="${v}">`).join("");
    $("dRom").innerHTML = [...new Set(ALL.map(p => num(p.memory)).filter(Boolean))].sort((a, b) => a - b).map(v => `<option value="${v}">`).join("");
    $("fCat").innerHTML = '<option value="">All categories</option>' + u("product_category").map(v => `<option>${E(v)}</option>`).join("");
    render();
  } catch (e) { $("list").innerHTML = `<div class="empty">Could not load products.<br><small>${E(e.message)}</small></div>`; }
}
function title(p) { const r = num(p.ram), m = num(p.memory); let t = up(p.model); if ((r || m) && !t.includes(r || "~") && !t.includes(m || "~")) t += " " + (r && m ? r + "/" + m : r || m); return t; }
function render() {
  const q = $("q").value.trim().toLowerCase(), cat = $("fCat").value, sort = $("fSort").value;
  const rows = ALL.filter(p => (!cat || up(p.product_category) === cat) && (!onlyStock || stock(p) > 0) &&
    (!q || [p.product_id, p.company_name, p.model, p.color, p.product_category, p.ram, p.memory].join(" ").toLowerCase().includes(q)));
  rows.sort(sort === "name" ? (a, b) => (up(a.company_name) + up(a.model)).localeCompare(up(b.company_name) + up(b.model))
    : sort === "stock" ? (a, b) => stock(b) - stock(a) : (a, b) => String(b.created_date || "").localeCompare(String(a.created_date || "")) || String(b.product_id).localeCompare(String(a.product_id)));
  const tot = [...STK.values()].reduce((s, v) => s + Math.max(v, 0), 0);
  $("stats").innerHTML = `<div class="stat"><small>Products</small><b>${M(ALL.length)}</b></div><div class="stat"><small>In stock (items)</small><b>${M(ALL.filter(p => stock(p) > 0).length)}</b></div><div class="stat"><small>Total pieces</small><b>${M(tot)}</b></div>`;
  $("sub").textContent = rows.length === ALL.length ? `${M(ALL.length)} products` : `${M(rows.length)} of ${M(ALL.length)} products`;
  $("list").innerHTML = rows.slice(0, shown).map(p => { const s = stock(p);
    return `<article class="row" data-id="${E(p.product_id)}" tabindex="0">
      <div class="n"><b>${E(title(p))}</b><small>${E(up(p.color))}${p.color ? " · " : ""}${E(p.product_id)}</small></div>
      <div class="m"><span>${E(up(p.company_name))}</span><br><small>${E(up(p.product_category))}</small></div>
      <div class="p"><span class="num hide-m" style="text-align:right">${Number(p.cost_price) ? "Rs " + M(p.cost_price) : "—"}</span><span class="num" style="text-align:right">${Number(p.mrp) ? "MRP " + M(p.mrp) : ""}</span></div>
      <div class="stk badge ${s > 0 ? "ok" : s < 0 ? "bad" : ""}">${M(s)}</div></article>`; }).join("") || '<div class="empty">No products match your search.</div>';
  $("more").hidden = rows.length <= shown; $("more").textContent = `Show more (${M(rows.length - shown)} remaining)`;
}

const isMob = () => /MOBILE|PHONE/.test(up($("fCategory").value));
const syncMob = () => document.querySelectorAll(".mob").forEach(x => x.style.display = isMob() ? "" : "none");
$("fCategory").addEventListener("input", syncMob);
$("frm").addEventListener("input", e => { e.target.classList.remove("bad"); const er = e.target.closest(".fld"); er && er.querySelector(".err") && (er.querySelector(".err").textContent = ""); });
function open(p) {
  editing = p ? String(p.product_id) : null;
  $("dTitle").textContent = p ? "Edit product" : "New product"; $("dSub").textContent = p ? "ID " + p.product_id + " · stock " + M(stock(p)) : "A product ID is created automatically";
  $("fCategory").value = p ? up(p.product_category) : ""; $("fBrand").value = p ? up(p.company_name) : ""; $("fModel").value = p ? up(p.model) : ""; $("fColor").value = p ? up(p.color) : "";
  $("fRam").value = p ? num(p.ram) : ""; $("fRom").value = p ? num(p.memory) : ""; $("fCost").value = p && Number(p.cost_price) ? p.cost_price : ""; $("fMrp").value = p && Number(p.mrp) ? p.mrp : ""; $("fRem").value = p ? up(p.remarks) : "";
  document.querySelectorAll("#frm .bad").forEach(x => x.classList.remove("bad")); document.querySelectorAll("#frm .err").forEach(x => x.textContent = "");
  $("btnDel").hidden = !(p && ERP.auth.can("delete")); syncMob(); $("dlg").showModal(); $("frm").scrollTop = 0;
}
$("list").onclick = e => { const r = e.target.closest(".row"); if (r) open(ALL.find(p => String(p.product_id) === r.dataset.id)); };
$("list").onkeydown = e => { if (e.key === "Enter" && e.target.classList.contains("row")) open(ALL.find(p => String(p.product_id) === e.target.dataset.id)); };

$("btnSave").onclick = () => ERP.ui.busy($("btnSave"), async () => {
  const err = (id, m) => { const el = $(id); el.classList.add("bad"); el.closest(".fld").querySelector(".err").textContent = m; };
  const p = { product_id: editing || ERP.db.products.newId(), product_category: up($("fCategory").value), company_name: up($("fBrand").value), model: up($("fModel").value), color: up($("fColor").value),
    ram: isMob() ? gb($("fRam").value).toUpperCase() : "", memory: isMob() ? gb($("fRom").value).toUpperCase() : "", remarks: up($("fRem").value),
    cost_price: $("fCost").value === "" ? 0 : Number($("fCost").value), mrp: $("fMrp").value === "" ? 0 : Number($("fMrp").value) };
  let ok = true;
  if (!p.product_category) { err("fCategory", "Required"); ok = false; } if (!p.company_name) { err("fBrand", "Required"); ok = false; } if (!p.model) { err("fModel", "Required"); ok = false; }
  if (p.cost_price < 0 || isNaN(p.cost_price)) { err("fCost", "Invalid amount"); ok = false; } if (p.mrp < 0 || isNaN(p.mrp)) { err("fMrp", "Invalid amount"); ok = false; }
  if (!ok) return;
  const key = x => [up(x.company_name), up(x.model), up(x.color), num(x.ram), num(x.memory)].join("|");
  const dup = ALL.find(x => key(x) === key(p) && String(x.product_id) !== p.product_id);
  if (dup && !confirm(`The same product already exists (${dup.product_id}).\nSave this as a duplicate?`)) return;
  try { await ERP.db.products.save(p); ERP.ui.toast(editing ? "Product updated" : "Product saved: " + p.product_id); $("dlg").close(); await load(); }
  catch (e) { ERP.ui.toast(e.message, "err"); }
});
$("btnDel").onclick = async () => {
  const p = ALL.find(x => String(x.product_id) === editing);
  if (STK.has(editing)) return ERP.ui.toast("This product has stock/sales/purchase history, so it cannot be deleted.", "err");
  if (!confirm(`Delete ${title(p)} (${editing})?`)) return;
  try { await ERP.db.products.remove(editing); ERP.ui.toast("Product deleted"); $("dlg").close(); await load(); } catch (e) { ERP.ui.toast(e.message, "err"); }
};
$("btnNew").onclick = () => open(null);
$("more").onclick = () => { shown += 50; render(); };
$("q").oninput = ERP.ui.debounce(() => { shown = 50; render(); }, 200);
$("fCat").onchange = $("fSort").onchange = () => { shown = 50; render(); };
$("chipStock").onclick = e => { onlyStock = !onlyStock; e.currentTarget.setAttribute("aria-pressed", onlyStock); shown = 50; render(); };
$("btnExport").onclick = () => ERP.ui.downloadCSV("products_" + ERP.ui.today() + ".csv", ALL.map(p => ({ ...p, stock: stock(p) })));
(async () => { await ERP.auth.guard(); if (!ERP.auth.can("write")) $("btnNew").hidden = true; load(); })();
</script>
</body>
</html>
